[package]
name = "fm-context-continuity"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Bounded, integrity-checked context checkpoints for Firstmate"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "backup", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[[test]]
name = "continuity"
path = "../../tests/context-continuity.rs"
