<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bearings - fleet board</title>
<style>
/* ============================================================
   Bearings board - self-contained Matrix-inspired visual system.
   The reusable board keeps all behavior in the script below; this
   block owns only portable presentation tokens and component chrome.
   ============================================================ */
:root {
  --matrix-black: #020604;
  --matrix-void: #040b07;
  --matrix-charcoal: #07140d;
  --matrix-panel: #0a1b10;
  --matrix-panel-strong: #0e2515;
  --matrix-line: #164c28;
  --matrix-line-soft: #0f2f1b;
  --matrix-line-bright: #38ff7b;
  --matrix-glow: rgba(40, 255, 112, 0.22);
  --matrix-glow-strong: rgba(72, 255, 139, 0.42);
  --matrix-screen: rgba(9, 255, 92, 0.075);
  --matrix-scan: rgba(121, 255, 159, 0.055);
  --green-950: #031009;
  --green-900: #06180d;
  --green-850: #092213;
  --green-800: #0d2d19;
  --green-700: #14572e;
  --green-600: #1e8146;
  --green-500: #27b461;
  --green-400: #42e57f;
  --green-300: #7dffa3;
  --green-200: #b7ffc8;
  --green-100: #ddffe6;
  --lime-400: #b6ff5f;
  --lime-300: #d4ff87;
  --mint-400: #3fffc2;
  --mint-300: #94ffe2;
  --olive-300: #9fb96d;
  --ink-shadow: rgba(0, 0, 0, 0.62);
  --white: #f1fff4;
  --bg-page: var(--matrix-black);
  --surface-card: var(--matrix-charcoal);
  --surface-card-warm: var(--matrix-panel);
  --text-strong: var(--green-100);
  --text-body: #b6efc2;
  --text-muted: #82c792;
  --text-faint: #578161;
  --border-default: var(--matrix-line);
  --border-soft: var(--matrix-line-soft);
  --status-online: var(--green-300);
  --status-online-soft: #082818;
  --status-warn: var(--lime-300);
  --status-warn-soft: #1d2a0f;
  --status-danger: #82ff6f;
  --status-danger-soft: #211f09;
  --status-info: var(--mint-300);
  --status-info-soft: #08261f;
  --font-display: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  --font-sans: "Avenir Next", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  --fs-h3: 1.4rem;
  --fs-h4: 1.15rem;
  --fs-base: 1rem;
  --fs-sm: 0.9375rem;
  --fs-xs: 0.8125rem;
  --fs-2xs: 0.6875rem;
  --ls-caps: 0.16em;
  --radius-xs: 4px;
  --radius-sm: 7px;
  --radius-md: 10px;
  --radius-banner: 5px;
  --radius-lg: 14px;
  --radius-pill: 999px;
  --shadow-sm: 0 0 0 1px rgba(61, 255, 124, 0.08), 0 18px 46px rgba(0, 0, 0, 0.34);
  --shadow-hard: 0 0 0 1px rgba(66, 229, 127, 0.26), 0 0 22px rgba(39, 180, 97, 0.16), 0 24px 60px rgba(0, 0, 0, 0.48);
  --shadow-hard-sm: 0 0 0 1px rgba(66, 229, 127, 0.36), 0 0 14px rgba(39, 180, 97, 0.18);
  --focus-ring: 0 0 0 2px var(--matrix-black), 0 0 0 5px var(--lime-300), 0 0 24px var(--matrix-glow-strong);
  --container-app: 1180px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg-page); }
body {
  min-height: 100vh;
  font-family: var(--font-sans);
  color: var(--text-body);
  background:
    radial-gradient(circle at 12% -10%, rgba(38, 255, 110, 0.16), transparent 34rem),
    radial-gradient(circle at 86% 8%, rgba(63, 255, 194, 0.11), transparent 30rem),
    linear-gradient(90deg, rgba(67, 255, 124, 0.035) 1px, transparent 1px),
    linear-gradient(0deg, rgba(67, 255, 124, 0.026) 1px, transparent 1px),
    var(--bg-page);
  background-size: auto, auto, 44px 44px, 44px 44px, auto;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(180deg, transparent 0 9px, var(--matrix-scan) 10px, transparent 11px),
    linear-gradient(90deg, transparent, rgba(114, 255, 154, 0.055), transparent);
  mix-blend-mode: screen;
  opacity: 0.62;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }

/* ---- fm-badge ---- */
.fm-badge {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 800; line-height: 1;
  padding: 5px 9px 4px; text-transform: uppercase; letter-spacing: 0.08em;
  border-radius: var(--radius-xs); border: 1px solid currentColor;
  white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
}
.fm-badge--online  { background: var(--status-online-soft); color: var(--status-online); border-color: rgba(125, 255, 163, 0.62); }
.fm-badge--warn    { background: var(--status-warn-soft); color: var(--status-warn); border-color: rgba(212, 255, 135, 0.72); }
.fm-badge--danger  { background: var(--status-danger-soft); color: var(--status-danger); border-color: rgba(130, 255, 111, 0.86); box-shadow: inset 3px 0 0 currentColor; }
.fm-badge--info    { background: var(--status-info-soft); color: var(--status-info); border-color: rgba(148, 255, 226, 0.58); }
.fm-badge--neutral { background: #0d1610; color: var(--text-muted); border-color: rgba(130, 199, 146, 0.46); }
.fm-badge--solid   { background: var(--green-300); color: #031009; border-color: var(--green-100); box-shadow: 0 0 18px rgba(125, 255, 163, 0.22); }

/* ---- fm-btn ---- */
.fm-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-mono); font-weight: 800; line-height: 1; white-space: nowrap;
  border: 1.5px solid transparent; border-radius: var(--radius-banner); cursor: pointer;
  text-decoration: none; transition: background 120ms ease, border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease, color 120ms ease;
}
.fm-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.fm-btn:active { transform: translateY(1px); }
.fm-btn--sm { font-size: var(--fs-xs); padding: 9px 16px; }
.fm-btn--primary { background: var(--green-300); color: #031009; border-color: var(--green-100); box-shadow: var(--shadow-hard-sm); }
.fm-btn--primary:hover { background: var(--green-200); }
.fm-btn--gold { background: transparent; color: var(--lime-300); border-color: rgba(212, 255, 135, 0.72); box-shadow: inset 0 0 0 1px rgba(212, 255, 135, 0.18), 0 0 18px rgba(182, 255, 95, 0.14); }
.fm-btn--gold:hover { background: rgba(182, 255, 95, 0.13); color: var(--green-100); border-color: var(--lime-300); }
.fm-btn[disabled] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

/* ---- fm-card ---- */
.fm-card {
  background: linear-gradient(180deg, rgba(14, 37, 21, 0.94), rgba(7, 20, 13, 0.98));
  border: 1px solid var(--border-default); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm); overflow: hidden;
}
.fm-card--poster {
  border: 2px solid rgba(66, 229, 127, 0.84); border-radius: var(--radius-md);
  box-shadow: var(--shadow-hard); position: relative;
}
.fm-card--poster::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(125, 255, 163, 0.08), transparent 46%);
}
.fm-card--warm { background: linear-gradient(180deg, rgba(10, 27, 16, 0.96), rgba(6, 18, 11, 0.98)); }

/* ---- fm-sign ---- */
.fm-sign {
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-weight: 800;
  text-transform: uppercase; letter-spacing: var(--ls-caps); font-size: var(--fs-xs);
  line-height: 1; white-space: nowrap;
}
.fm-sign--eyebrow { color: var(--green-300); text-shadow: 0 0 14px rgba(66, 229, 127, 0.24); }
.fm-sign--muted { color: var(--text-faint); }
.fm-sign svg { width: 14px; height: 14px; }
.fm-ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.18em; }

/* ============================================================
   Board chrome (bb-*)
   ============================================================ */
.bb-nav {
  position: sticky; top: 0; z-index: 20;
  background: rgba(2, 8, 5, 0.9); backdrop-filter: saturate(150%) blur(10px);
  border-bottom: 1px solid rgba(56, 255, 123, 0.22);
  box-shadow: 0 1px 0 rgba(125, 255, 163, 0.12), 0 16px 46px rgba(0, 0, 0, 0.42);
}
.bb-nav__inner {
  max-width: var(--container-app); margin: 0 auto; padding: 0 28px; height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.bb-brand { display: inline-flex; align-items: center; gap: 12px; min-width: 0; }
.bb-brand__disc {
  display: grid; place-items: center; width: 34px; height: 34px; flex: none;
  border-radius: 8px; background: #06180d; color: var(--green-300);
  border: 1.5px solid var(--green-500); box-shadow: inset 0 0 14px rgba(39, 180, 97, 0.24), 0 0 18px rgba(39, 180, 97, 0.18);
}
.bb-brand__disc svg { width: 60%; height: 60%; }
.bb-brand__wm {
  font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--text-strong);
  line-height: 1; letter-spacing: 0.18em; text-transform: uppercase;
}
.bb-meta-mono { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-faint); white-space: nowrap; }

.bb-main {
  position: relative; z-index: 1; max-width: var(--container-app); margin: 0 auto;
  padding: 26px 28px 72px; display: flex; flex-direction: column; gap: 22px;
}

/* stat strip */
.bb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.bb-stat {
  display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; min-width: 0;
  background: linear-gradient(180deg, rgba(10, 27, 16, 0.96), rgba(5, 16, 10, 0.98));
  border: 1px solid var(--border-soft); border-left: 3px solid var(--green-600); border-radius: var(--radius-md);
}
.bb-stat--call { background: linear-gradient(180deg, rgba(18, 48, 26, 0.98), rgba(7, 20, 13, 0.98)); border-color: rgba(125, 255, 163, 0.58); border-left-color: var(--green-300); box-shadow: 0 0 24px rgba(39, 180, 97, 0.12); }
.bb-stat__num { font-family: var(--font-mono); font-size: var(--fs-h3); font-weight: 800; line-height: 1; color: var(--green-200); }
.bb-stat--call .bb-stat__num { color: var(--green-300); text-shadow: 0 0 18px rgba(125, 255, 163, 0.32); }
.bb-stat__label { font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }

.bb-section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bb-section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0; }
.bb-cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 22px; }

/* ---- Captain's Call: one card at a time, dealt off a visible stack ---- */
.bb-callwrap { display: flex; flex-direction: column; gap: 12px; }
.bb-stacknav { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.bb-stacknav__count { flex: 1 1 auto; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-stacknav__btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; cursor: pointer;
  background: #06150c; color: var(--green-200);
  border: 1px solid rgba(125, 255, 163, 0.38); border-radius: var(--radius-sm);
  transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}
.bb-stacknav__btn:hover { background: rgba(39, 180, 97, 0.16); border-color: var(--green-300); box-shadow: 0 0 16px rgba(39, 180, 97, 0.16); }
.bb-stacknav__btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.bb-stacknav__btn[disabled] { opacity: 0.38; cursor: not-allowed; box-shadow: none; }
.bb-stacknav__btn svg { width: 16px; height: 16px; }
.bb-call { position: relative; display: grid; }
.bb-call::before, .bb-call::after {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background: #06130b; border: 1.5px solid rgba(66, 229, 127, 0.5);
  border-radius: var(--radius-md); box-shadow: 0 0 16px rgba(39, 180, 97, 0.1);
}
.bb-call::before { transform: rotate(1.3deg) translate(4px, 5px); }
.bb-call::after  { transform: rotate(-1.1deg) translate(-3px, 9px); border-style: dashed; opacity: 0.9; }
.bb-call--penult::after { display: none; }
.bb-call--last::before, .bb-call--last::after,
.bb-call--empty::before, .bb-call--empty::after { display: none; }
.bb-call > .bb-decision { grid-area: 1 / 1; z-index: 1; }
.bb-call > .bb-decision[hidden] { display: none; }
.bb-decision { display: flex; flex-direction: column; min-width: 0; }
.bb-decision__pad { position: relative; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
.bb-decision__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.bb-decision__repo { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 48%; }
.bb-decision__title { margin: 0; font-size: var(--fs-h4); font-weight: 800; color: var(--text-strong); line-height: 1.25; overflow-wrap: anywhere; }
.bb-decision__detail { margin: 0; font-size: var(--fs-sm); color: var(--text-muted); line-height: 1.45; overflow-wrap: anywhere; }
.bb-ctx { display: flex; flex-direction: column; gap: 6px; }
.bb-ctx__row { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px; align-items: baseline; }
.bb-ctx__k { font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--mint-400); white-space: nowrap; }
.bb-ctx__v { font-size: var(--fs-sm); color: var(--text-muted); line-height: 1.4; min-width: 0; overflow-wrap: anywhere; }
.bb-decision__link { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--mint-300); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; min-width: 0; }
.bb-decision__link:hover { color: var(--green-200); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.bb-decision form { display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto; min-width: 0; }
.bb-opts { display: flex; flex-direction: column; gap: 7px; }
.bb-opt {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; cursor: pointer; min-width: 0;
  background: rgba(3, 16, 9, 0.74); border: 1px solid rgba(65, 194, 102, 0.36);
  border-radius: var(--radius-sm); transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
}
.bb-opt:hover { border-color: rgba(125, 255, 163, 0.72); background: rgba(8, 40, 24, 0.78); }
.bb-opt input { accent-color: var(--green-300); margin-top: 3px; flex: none; }
.bb-opt input:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.bb-opt__body { min-width: 0; flex: 1 1 auto; }
.bb-opt__label { display: block; font-size: var(--fs-sm); font-weight: 800; color: var(--text-strong); line-height: 1.3; overflow-wrap: anywhere; }
.bb-opt__hint { display: block; font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.35; margin-top: 1px; overflow-wrap: anywhere; }
.bb-opt__rec { flex: none; align-self: center; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.08em; color: #031009; background: var(--lime-300);
  border: 1px solid var(--green-100); border-radius: var(--radius-xs); padding: 3px 7px 2px; }
.bb-opt:has(input:checked) { border-color: var(--green-300); background: rgba(22, 76, 40, 0.82); box-shadow: inset 3px 0 0 var(--green-300), 0 0 18px rgba(39, 180, 97, 0.14); }
.bb-decision__foot { display: flex; align-items: center; gap: 10px; margin-top: auto; min-width: 0; flex-wrap: wrap; }
.bb-queued {
  display: none; align-items: center; gap: 6px; flex: none;
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--green-300); background: var(--status-online-soft); border: 1px solid rgba(125, 255, 163, 0.58);
  border-radius: var(--radius-xs); padding: 5px 9px 4px;
}
.is-queued .bb-queued { display: inline-flex; }
.bb-limit { display: none; font-size: var(--fs-xs); font-weight: 700; color: var(--status-danger); overflow-wrap: anywhere; }
.bb-limit.is-visible { display: inline; }
.bb-freeform { width: 100%; font-family: var(--font-sans); font-size: var(--fs-sm); color: var(--text-strong);
  background: #020b06; border: 1px solid rgba(65, 194, 102, 0.5); border-radius: var(--radius-sm); padding: 9px 11px; }
.bb-freeform::placeholder { color: var(--text-faint); }
.bb-freeform:focus { outline: none; border-color: var(--green-300); box-shadow: var(--focus-ring); }

/* ---- compact rows (Underway / Landed / Charted) ---- */
.bb-rows { display: flex; flex-direction: column; }
.bb-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  border-top: 1px solid var(--border-soft); min-width: 0;
}
.bb-row:first-child { border-top: none; }
#bb-underway .bb-row { border-left: 3px solid var(--mint-400); background: linear-gradient(90deg, rgba(63, 255, 194, 0.075), transparent 42%); }
#bb-landed .bb-row { border-left: 3px solid var(--green-300); background: linear-gradient(90deg, rgba(125, 255, 163, 0.075), transparent 42%); }
#bb-charted .bb-row { border-left: 3px solid var(--green-600); }
#bb-charted .bb-row:has(.fm-badge--warn) { border-left-color: var(--lime-300); background: linear-gradient(90deg, rgba(182, 255, 95, 0.075), transparent 42%); }
#bb-charted .bb-row:has(.fm-badge--danger) { border-left-color: var(--status-danger); background: repeating-linear-gradient(135deg, rgba(130, 255, 111, 0.08) 0 1px, transparent 1px 9px); }
.bb-row__main { min-width: 0; flex: 1 1 auto; }
.bb-row__title { font-size: var(--fs-sm); font-weight: 800; color: var(--text-strong); line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-row__sub { font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.3; margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-row__id { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-faint); white-space: nowrap; }
.bb-row__pr { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 700; color: var(--mint-300); white-space: nowrap; max-width: 9rem; overflow: hidden; text-overflow: ellipsis; }
.bb-row__pr:hover { color: var(--green-200); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.bb-row__check { width: 26px; height: 26px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none;
  background: var(--status-online-soft); color: var(--status-online); border: 1px solid rgba(125, 255, 163, 0.62); box-shadow: 0 0 14px rgba(125, 255, 163, 0.16); }
.bb-row__check svg { width: 15px; height: 15px; }
.bb-morechip {
  display: inline-flex; align-items: center; gap: 6px; margin: 10px 18px 12px;
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 800; color: var(--text-muted);
  border: 1px dashed rgba(130, 199, 146, 0.56); border-radius: var(--radius-pill); padding: 5px 12px; width: fit-content; max-width: calc(100% - 36px); overflow-wrap: anywhere;
}
.bb-empty { padding: 18px; font-size: var(--fs-sm); color: var(--text-muted); }

/* ---- Charted Next dispatch picker ---- */
.bb-pick { accent-color: var(--green-300); width: 16px; height: 16px; flex: none; cursor: pointer; margin: 0; }
.bb-pick:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.bb-pick-spacer { width: 16px; flex: none; }
.bb-dispatch {
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  border-top: 1px solid var(--border-default); background: linear-gradient(90deg, rgba(39, 180, 97, 0.13), rgba(10, 27, 16, 0.98));
}
.bb-dispatch__count { flex: 1 1 auto; font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 800; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.08em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.bb-foot { display: flex; justify-content: flex-end; border-top: 1px solid var(--border-default); padding-top: 14px; }

@media (max-width: 900px) {
  .bb-cols { grid-template-columns: 1fr; }
}

@media (max-width: 620px) {
  .bb-nav__inner { padding: 0 18px; }
  .bb-main { padding: 20px 18px 48px; }
  .bb-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bb-section__head { align-items: flex-start; flex-direction: column; }
  .bb-decision__top { align-items: flex-start; flex-wrap: wrap; }
  .bb-decision__repo { max-width: 100%; }
  .bb-row { align-items: flex-start; flex-wrap: wrap; }
  .bb-row__title, .bb-row__sub { white-space: normal; overflow-wrap: anywhere; }
  .bb-row__pr { max-width: 100%; }
  .bb-dispatch { align-items: stretch; flex-wrap: wrap; }
  .bb-dispatch__count { flex-basis: 100%; white-space: normal; }
}

@media (max-width: 420px) {
  .bb-stats { grid-template-columns: 1fr; }
  .bb-brand__wm { font-size: 17px; letter-spacing: 0.14em; }
  .bb-decision__pad { padding: 16px; }
  .bb-ctx__row { grid-template-columns: 1fr; gap: 2px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<header class="bb-nav">
  <div class="bb-nav__inner">
    <span class="bb-brand">
      <span class="bb-brand__disc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 6v16"/><path d="m19 13 2-1a9 9 0 0 1-18 0l2 1"/><path d="M9 11h6"/><circle cx="12" cy="4" r="2"/>
        </svg>
      </span>
      <span class="bb-brand__wm">bearings</span>
    </span>
  </div>
</header>

<main class="bb-main">

  <div class="bb-stats" id="bb-stats"></div>

  <div class="bb-cols">
  <section class="bb-section">
    <div class="bb-section__head">
      <span class="fm-sign fm-sign--eyebrow">
        <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
        Captain's Call
      </span>
      <span class="fm-sign fm-sign--muted" id="bb-call-sub"></span>
    </div>
    <div class="bb-callwrap">
      <div class="bb-call" id="bb-call"></div>
      <!-- nav sits under the stack so the active card's top edge aligns with
           the Charted Next card across the row -->
      <div class="bb-stacknav">
        <span class="bb-stacknav__count" id="bb-stack-count">-</span>
        <button type="button" class="bb-stacknav__btn" id="bb-stack-prev" aria-label="Previous card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="bb-stacknav__btn" id="bb-stack-next" aria-label="Next card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="bb-section">
    <div class="bb-section__head">
      <span class="fm-sign fm-sign--eyebrow">
        <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        Charted Next
      </span>
      <span class="fm-sign fm-sign--muted" id="bb-charted-sub"></span>
    </div>
    <div class="fm-card fm-card--warm">
      <div class="bb-rows" id="bb-charted"></div>
      <div class="bb-dispatch" id="bb-dispatch" hidden>
        <span class="bb-dispatch__count" id="bb-dispatch-count">nothing picked</span>
        <span class="bb-queued" id="bb-dispatch-queued">
          <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          queued
        </span>
        <button type="button" class="fm-btn fm-btn--sm fm-btn--gold" id="bb-dispatch-btn">Queue dispatch order</button>
      </div>
    </div>
  </section>
  </div>

  <div class="bb-cols">
    <section class="bb-section">
      <div class="bb-section__head">
        <span class="fm-sign fm-sign--eyebrow">
          <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10.189V14"/><path d="M12 2v3"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76"/><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
          Underway
        </span>
      </div>
      <div class="fm-card"><div class="bb-rows" id="bb-underway"></div></div>
    </section>

    <section class="bb-section">
      <div class="bb-section__head">
        <span class="fm-sign fm-sign--eyebrow">
          <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
          Recently Landed
        </span>
      </div>
      <div class="fm-card"><div class="bb-rows" id="bb-landed"></div></div>
    </section>
  </div>

  <footer class="bb-foot">
    <span class="bb-meta-mono" id="bb-provenance">-</span>
  </footer>

</main>

<!-- ONE SLOT. bin/fm-bearings-board.sh build injects the fresh
     fm-bearings-board.v1 payload in place of the placeholder below; everything
     above and below is the shipped template and is never regenerated per run. -->
<script id="bearings-data" type="application/json">
__FM_BEARINGS_BOARD_DATA__
</script>

<script>
(function () {
  "use strict";

  /* Fail closed: a board with unreadable or wrong-schema data says so plainly
     instead of rendering an empty page that looks like an empty fleet. */
  function renderBoardError(msg) {
    var main = document.querySelector(".bb-main");
    main.innerHTML = "";
    var card = document.createElement("div");
    card.className = "fm-card fm-card--poster bb-decision";
    var pad = document.createElement("div");
    pad.className = "bb-decision__pad";
    var h = document.createElement("h3");
    h.className = "bb-decision__title";
    h.textContent = "This board could not load";
    var d = document.createElement("p");
    d.className = "bb-decision__detail";
    d.textContent = msg + " - ask firstmate to rebuild the board.";
    pad.appendChild(h);
    pad.appendChild(d);
    card.appendChild(pad);
    main.appendChild(card);
  }

  var data;
  try {
    data = JSON.parse(document.getElementById("bearings-data").textContent);
  } catch (e) {
    renderBoardError("The board data is not valid JSON");
    return;
  }
  if (!data || data.schema !== "fm-bearings-board.v1") {
    renderBoardError("Unsupported board data schema: " + (data && data.schema ? data.schema : "(none)"));
    return;
  }
  var fleetLists = [data.captains_call, data.underway, data.landed, data.charted];
  var callItemsValid = Array.isArray(data.captains_call) && data.captains_call.every(function (item) {
    return item && typeof item === "object" &&
      typeof item.key === "string" && item.key.length > 0 &&
      typeof item.type === "string" && item.type.length > 0 &&
      typeof item.title === "string" && item.title.length > 0 &&
      Array.isArray(item.options);
  });
  if (!fleetLists.every(Array.isArray) || !callItemsValid) {
    renderBoardError("The board data does not have the required structure");
    return;
  }

  try {
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function badge(tone, text) { return el("span", "fm-badge fm-badge--" + tone, text); }
  /* Warnings ride the charted feed for layout only; they are alarms, not work,
     so every count of queued work excludes them. */
  function isWarning(t) { return t && t.kind === "warning"; }
  function chartedQueued(rows) { return (rows || []).filter(function (t) { return !isWarning(t); }); }
  var chartedMoreQueued = data.charted_more || 0;
  var chartedMoreWarnings = data.charted_warning_more || 0;
  function utf8ByteLength(text) { return new TextEncoder().encode(text).length; }
  var CHECK_SVG = '<svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  document.getElementById("bb-provenance").textContent = data.schema + " · " + data.generated;

  /* stat strip */
  var callTotal = data.captains_call.length;
  var stats = [
    { n: callTotal, l: "need you", call: true },
    { n: data.underway.length, l: "underway" },
    { n: data.landed.length, l: "landed recently" },
    { n: chartedQueued(data.charted).length + chartedMoreQueued, l: "charted next" }
  ];
  var strip = document.getElementById("bb-stats");
  stats.forEach(function (s) {
    var t = el("div", "bb-stat" + (s.call ? " bb-stat--call" : ""));
    t.appendChild(el("span", "bb-stat__num", String(s.n)));
    t.appendChild(el("span", "bb-stat__label", s.l));
    strip.appendChild(t);
  });
  document.getElementById("bb-call-sub").textContent =
    callTotal ? callTotal + " item" + (callTotal === 1 ? "" : "s") + " wait on you, captain" : "nothing needs you, captain";

  /* Captain's Call deck: every item renders as the same full card */
  var deck = document.getElementById("bb-call");
  function ctxRow(k, v, rec) {
    var row = el("div", "bb-ctx__row" + (rec ? " bb-ctx__row--rec" : ""));
    row.appendChild(el("span", "bb-ctx__k", k));
    row.appendChild(el("span", "bb-ctx__v", v));
    return row;
  }

  data.captains_call.forEach(function (item) {
    var card = el("div", "fm-card fm-card--poster bb-decision");
    var pad = el("div", "bb-decision__pad");

    var top = el("div", "bb-decision__top");
    if (item.type === "merge") {
      top.appendChild(badge("online", "checks green"));
      top.appendChild(badge(item.risk === "low" ? "neutral" : "warn", "risk " + item.risk));
    } else {
      top.appendChild(badge("solid", "decision"));
      top.appendChild(el("span", "bb-decision__repo", item.repo));
    }
    pad.appendChild(top);

    pad.appendChild(el("h3", "bb-decision__title", item.title));

    if (item.type === "merge") {
      if (item.detail) pad.appendChild(el("p", "bb-decision__detail", item.detail));
      if (item.pr_url) {
        var pr = el("a", "bb-decision__link", item.pr_url);
        pr.href = item.pr_url; pr.target = "_blank"; pr.rel = "noopener";
        pad.appendChild(pr);
      }
    } else {
      /* the rec marker on the option itself carries the recommendation */
      var ctx = el("div", "bb-ctx");
      if (item.about) ctx.appendChild(ctxRow("about", item.about));
      if (item.decide) ctx.appendChild(ctxRow("decide", item.decide));
      pad.appendChild(ctx);
    }

    var form = document.createElement("form");
    form.setAttribute("data-lavish-question", item.key);
    var opts = el("div", "bb-opts");
    item.options.forEach(function (o) {
      var lab = el("label", "bb-opt");
      var input = document.createElement("input");
      input.type = "radio"; input.name = "answer"; input.value = o.value;
      lab.appendChild(input);
      var body = el("span", "bb-opt__body");
      body.appendChild(el("span", "bb-opt__label", o.label));
      if (o.hint) body.appendChild(el("span", "bb-opt__hint", o.hint));
      lab.appendChild(body);
      if (item.recommend_value && o.value === item.recommend_value) {
        lab.appendChild(el("span", "bb-opt__rec", "rec"));
      }
      opts.appendChild(lab);
    });
    form.appendChild(opts);

    if (item.allow_freeform) {
      var ff = document.createElement("input");
      ff.type = "text"; ff.name = "note"; ff.className = "bb-freeform";
      ff.placeholder = item.freeform_hint || "or answer in your own words…";
      form.appendChild(ff);
    }

    var foot = el("div", "bb-decision__foot");
    var btn = el("button", "fm-btn fm-btn--sm " + (item.type === "merge" ? "fm-btn--gold" : "fm-btn--primary"), "Queue answer");
    btn.type = "submit";
    foot.appendChild(btn);
    var q = el("span", "bb-queued");
    q.innerHTML = CHECK_SVG + " queued";
    foot.appendChild(q);
    var answerLimit = el("span", "bb-limit");
    answerLimit.setAttribute("role", "alert");
    foot.appendChild(answerLimit);
    form.appendChild(foot);

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      answerLimit.classList.remove("is-visible");
      var fd = new FormData(form);
      var value = fd.get("answer");
      var note = (fd.get("note") || "").trim();
      /* picked option, optionally annotated; a bare note is itself the answer */
      var answer = value ? (note ? value + " - " + note : value) : note;
      if (!answer) return;
      if (utf8ByteLength(answer) > 512) {
        answerLimit.textContent = "Answer is too long to queue (512 bytes maximum).";
        answerLimit.classList.add("is-visible");
        return;
      }
      if (window.lavish && window.lavish.queuePrompt) {
        /* close carries the composer-declared close mode: "release" frees a
           captain-gated work item instead of completing a question task */
        var ctxData = { question: item.key, answer: answer };
        if (item.close) ctxData.close = item.close;
        window.lavish.queuePrompt(
          "Captain's Call answer - " + item.title + ": " + answer,
          { tag: "choice", text: item.title + " -> " + answer, element: form,
            data: ctxData }
        );
      }
      card.classList.add("is-queued");
      /* deal the next card once this one is answered */
      setTimeout(function () { showCard(active < cards.length - 1 ? active + 1 : active); }, 450);
    });

    pad.appendChild(form);
    card.appendChild(pad);
    deck.appendChild(card);
  });

  /* stack navigation: one card at a time, dealt off the pile */
  var cards = Array.prototype.slice.call(deck.children);
  var active = 0;
  var stackCount = document.getElementById("bb-stack-count");
  var stackPrev = document.getElementById("bb-stack-prev");
  var stackNext = document.getElementById("bb-stack-next");
  var stackNav = stackCount.parentNode;
  function showCard(i) {
    active = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach(function (c, j) { c.hidden = j !== active; });
    var answered = deck.querySelectorAll(".is-queued").length;
    stackCount.textContent = "card " + (active + 1) + " of " + cards.length +
      (answered ? " · " + answered + " answered" : "");
    stackPrev.disabled = active === 0;
    stackNext.disabled = active === cards.length - 1;
    /* the pile thins as the deal approaches the bottom */
    deck.classList.toggle("bb-call--penult", active === cards.length - 2);
    deck.classList.toggle("bb-call--last", active === cards.length - 1);
  }
  if (cards.length) {
    stackPrev.addEventListener("click", function () { showCard(active - 1); });
    stackNext.addEventListener("click", function () { showCard(active + 1); });
    showCard(0);
  } else {
    deck.classList.add("bb-call--empty");
    deck.appendChild(el("div", "bb-empty", "Nothing needs your action right now."));
    stackNav.hidden = true;
  }

  /* Underway */
  var uw = document.getElementById("bb-underway");
  if (!data.underway.length) uw.appendChild(el("div", "bb-empty", "Nothing is underway."));
  data.underway.forEach(function (t) {
    var row = el("div", "bb-row");
    row.appendChild(badge(t.state === "working" ? "online" : "info", t.state));
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.doing));
    /* captain-facing rows name the repo; the internal task id shows only when
       no repo is known */
    main.appendChild(el("div", "bb-row__sub", t.kind + " · " + (t.repo || t.id)));
    row.appendChild(main);
    uw.appendChild(row);
  });

  /* Landed */
  var ld = document.getElementById("bb-landed");
  if (!data.landed.length) ld.appendChild(el("div", "bb-empty", "No recent completions are in the current baseline."));
  data.landed.forEach(function (t) {
    var row = el("div", "bb-row");
    var chk = el("span", "bb-row__check");
    chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    row.appendChild(chk);
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.what));
    main.appendChild(el("div", "bb-row__sub", (t.repo || t.id) + " · " + t.owner));
    row.appendChild(main);
    if (t.pr_url) {
      var a = el("a", "bb-row__pr", "#" + t.pr_url.split("/").pop());
      a.href = t.pr_url; a.title = t.pr_url; a.target = "_blank"; a.rel = "noopener";
      row.appendChild(a);
    }
    ld.appendChild(row);
  });

  /* Charted Next + dispatch picker */
  var ch = document.getElementById("bb-charted");
  var bar = document.getElementById("bb-dispatch");
  var barCount = document.getElementById("bb-dispatch-count");
  var barBtn = document.getElementById("bb-dispatch-btn");
  var anyPickable = false;

  function pickedIds() {
    return Array.prototype.map.call(ch.querySelectorAll(".bb-pick:checked"), function (c) { return c.value; });
  }
  function refreshBar(limitMessage) {
    var n = pickedIds().length;
    barCount.textContent = limitMessage || (n ? n + " picked for dispatch" : "pick queued work to dispatch");
    barBtn.disabled = !n;
  }

  if (!chartedQueued(data.charted).length && !chartedMoreQueued) {
    ch.appendChild(el("div", "bb-empty", "Nothing is queued."));
  }
  data.charted.forEach(function (t) {
    var row = el("div", "bb-row");
    if (t.dispatchable && !isWarning(t)) {
      anyPickable = true;
      var pick = document.createElement("input");
      pick.type = "checkbox"; pick.className = "bb-pick"; pick.value = t.id;
      pick.setAttribute("aria-label", "Pick " + t.id + " for dispatch");
      pick.addEventListener("change", function () {
        if (pick.checked && utf8ByteLength(pickedIds().join(",")) > 512) {
          pick.checked = false;
          refreshBar("Selection limit reached (512 bytes maximum). ");
          return;
        }
        refreshBar();
      });
      row.appendChild(pick);
    } else {
      row.appendChild(el("span", "bb-pick-spacer"));
    }
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.title));
    /* second line keeps the title uncrowded in the half-width column */
    var chSub = t.repo || t.id;
    main.appendChild(el("div", "bb-row__sub", t.reason ? t.reason + " · " + chSub : chSub));
    row.appendChild(main);
    if (isWarning(t)) row.appendChild(badge("danger", "needs repair"));
    else if (t.reason) row.appendChild(badge("warn", "waiting"));
    ch.appendChild(row);
  });
  var chartedShown = chartedQueued(data.charted).length;
  var chartedTotal = chartedShown + chartedMoreQueued;
  document.getElementById("bb-charted-sub").textContent =
    chartedMoreQueued ? "showing " + chartedShown + " of " + chartedTotal : "";
  if (chartedMoreQueued) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreQueued + " more queued - ask firstmate for the full chart"));
  }
  if (chartedMoreWarnings) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreWarnings + " more repair warning" + (chartedMoreWarnings === 1 ? "" : "s") + " - ask firstmate for the full chart"));
  }

  if (anyPickable) {
    bar.hidden = false;
    refreshBar();
    barBtn.addEventListener("click", function () {
      var ids = pickedIds();
      var dispatchAnswer = ids.join(",");
      if (!ids.length) return;
      if (utf8ByteLength(dispatchAnswer) > 512) {
        refreshBar("Selection is too long to queue (512 bytes maximum). ");
        return;
      }
      if (window.lavish && window.lavish.queuePrompt) {
        window.lavish.queuePrompt(
          "Dispatch order - start this queued work now: " + ids.join(", "),
          { tag: "choice", text: "Dispatch: " + ids.join(", "), element: bar,
            queueKey: "dispatch.charted",
            data: { question: "dispatch.charted", answer: dispatchAnswer } }
        );
      }
      bar.classList.add("is-queued");
    });
  }
  } catch (e) {
    renderBoardError("The board data could not be rendered");
  }
})();
</script>
</body>
</html>
