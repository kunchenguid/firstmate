<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firstmate flows</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#ffffff; --line:#e6e4df; --ink:#1c1b19; --dim:#736f68;
  --faint:#a8a49c; --accent:#3d6ff5; --run:#2f8f5b; --stop:#c2543a; --wait:#b8862b;
  --idle:#b6b2aa; --shadow:0 1px 2px rgba(24,23,20,.06),0 8px 24px rgba(24,23,20,.05);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131311; --panel:#1b1b19; --line:#2c2b28; --ink:#eceae4; --dim:#9c978d;
    --faint:#6b665e; --accent:#7d9dff; --run:#57b783; --stop:#e0765a; --wait:#d6a441;
    --idle:#4d4a45; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px}
.mark{font-weight:620;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--idle);transition:background .4s}
.pulse.on{background:var(--run);box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 60%,transparent);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.search{margin-left:auto;position:relative}
.search input{width:230px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);outline:none;transition:width .2s,border-color .2s}
.search input:focus{width:320px;border-color:var(--accent)}
.age{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}

main{max-width:1080px;margin:0 auto;padding:26px 24px 96px}
h2{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
  margin:30px 0 10px}
h2:first-child{margin-top:4px}
h2 .n{color:var(--faint);font-weight:400;margin-left:6px}

.lane{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:7px;
  box-shadow:var(--shadow);overflow:hidden;transition:border-color .18s}
.lane:hover{border-color:color-mix(in srgb,var(--accent) 32%,var(--line))}
.row{display:flex;align-items:center;gap:12px;padding:12px 15px;width:100%;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--idle)}
.dot.running{background:var(--run)}
.dot.needs-you{background:var(--stop)}
.dot.waiting{background:var(--wait)}
.dot.landed{background:var(--accent)}
.dot.armed{background:transparent;border:1.5px solid var(--run)}
.dot.unknown{background:transparent;border:1.5px solid var(--faint)}
.dot.record{background:transparent;border:1.5px dashed var(--faint)}
.name{font-weight:520;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12.5px;
  white-space:nowrap}
.chip{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.said{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1 1 auto;min-width:0}
.body{display:none;border-top:1px solid var(--line);padding:16px 15px}
.lane.open .body{display:block}

svg.graph{display:block;width:100%;height:auto;overflow:visible}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.25;rx:7}
.node text{font:11.5px var(--sans);fill:var(--dim);dominant-baseline:middle}
.node.done rect{fill:color-mix(in srgb,var(--accent) 11%,var(--panel));stroke:color-mix(in srgb,var(--accent) 40%,var(--line))}
.node.done text{fill:var(--ink)}
.node.current rect{fill:color-mix(in srgb,var(--run) 13%,var(--panel));stroke:var(--run);stroke-width:1.75}
.node.current text{fill:var(--ink);font-weight:600}
.node.blocked rect{fill:color-mix(in srgb,var(--stop) 13%,var(--panel));stroke:var(--stop);stroke-width:1.75}
.node.blocked text{fill:var(--ink);font-weight:600}
.node.uninstrumented rect{stroke-dasharray:3 3;stroke:var(--faint);fill:transparent}
.node.uninstrumented text{fill:var(--faint)}
.node.unknown rect{stroke-dasharray:3 3}
.node{cursor:pointer}
.node:hover rect{stroke:var(--accent)}
.node.sel rect{stroke:var(--accent);stroke-width:2}
.edge{stroke:var(--line);stroke-width:1.25;fill:none}
.edge.hot{stroke:color-mix(in srgb,var(--accent) 55%,var(--line))}
/* The travelling dash animates only while a lane is genuinely moving, so a
   still board reads as still rather than as busy. */
.edge.live{stroke:var(--run);stroke-dasharray:4 5;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}

.tools{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap;align-items:center}
.tool{border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12.5px;color:var(--dim);
  transition:border-color .15s,color .15s}
.tool:hover{border-color:var(--accent);color:var(--ink)}
.tool.danger:hover{border-color:var(--stop);color:var(--stop)}
.steer{display:none;gap:7px;margin-top:10px}
.steer.on{display:flex}
.steer input{flex:1;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);outline:none}
.steer input:focus{border-color:var(--accent)}

.log{margin-top:14px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
  max-height:340px;overflow:auto}
.log .head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:8px 12px;font-size:11.5px;color:var(--dim);display:flex;gap:10px;align-items:center}
.log pre{margin:0;padding:11px 12px;font:11.5px/1.65 var(--mono);white-space:pre-wrap;word-break:break-word}
.log .empty{padding:16px 12px;color:var(--dim);font-size:12.5px}
.src{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10.5px;color:var(--faint)}

.hint{color:var(--faint);font-size:12.5px;padding:2px 2px 10px}
details.records summary{cursor:pointer;color:var(--dim);font-size:12.5px;padding:7px 2px;list-style:none}
details.records summary::-webkit-details-marker{display:none}
details.records summary::before{content:"› ";color:var(--faint)}
details.records[open] summary::before{content:"⌄ "}

.sheet{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--panel);border-top:1px solid var(--line);
  box-shadow:0 -8px 32px rgba(0,0,0,.12);max-height:62vh;overflow:auto;transform:translateY(101%);
  transition:transform .22s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:none}
.sheet .in{max-width:1080px;margin:0 auto;padding:16px 24px 24px}
.sheet h3{margin:0 0 10px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.hit{padding:6px 0;border-bottom:1px solid var(--line);font:11.5px/1.6 var(--mono);color:var(--dim)}
.hit b{color:var(--ink);font-weight:500}
.ask{display:flex;gap:8px;margin-top:4px}
.ask input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
.ask input:focus{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:40;background:var(--ink);
  color:var(--bg);padding:9px 15px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:min(640px,90vw)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.askbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.askbar .in{max-width:1080px;margin:0 auto;padding:10px 24px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="mark"><span class="pulse" id="pulse"></span> Firstmate flows</div>
    <span class="age" id="age">projecting…</span>
    <div class="search"><input id="q" type="search" placeholder="Search everything  /" autocomplete="off"></div>
  </div>
</header>

<main id="main"><p class="hint">Reading the records…</p></main>

<div class="askbar"><div class="in"><form class="ask" id="askform">
  <input id="ask" placeholder="Ask firstmate about a flow - click a lane first to aim the question" autocomplete="off">
</form></div></div>

<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { lanes: [], open: null, node: null, meta: {} };

const GROUPS = [
  ["needs-you", "Needs you"],
  ["running", "Running"],
  ["armed", "Dispatched, not started"],
  ["waiting", "Waiting"],
  ["landed", "Landed"],
  ["idle", "Quiet"],
];

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function ago(iso) {
  if (!iso) return "-";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("on"), 4200);
}

// Layered DAG drawing, the Sugiyama shape: rank every node by its longest path
// from a source, order within the rank by first appearance, then route edges
// between rank columns. Our step graphs are small and already acyclic, so the
// crossing-reduction sweep a general library runs would have nothing to reduce.
function layout(nodes, edges) {
  const names = nodes.map((n) => n.name);
  const incoming = new Map(names.map((n) => [n, []]));
  for (const e of edges) if (incoming.has(e.to)) incoming.get(e.to).push(e.from);
  const rank = new Map();
  const rankOf = (name, seen = new Set()) => {
    if (rank.has(name)) return rank.get(name);
    if (seen.has(name)) return 0;
    seen.add(name);
    const parents = incoming.get(name) || [];
    const r = parents.length === 0 ? 0 : Math.max(...parents.map((p) => rankOf(p, seen) + 1));
    rank.set(name, r);
    return r;
  };
  names.forEach((n) => rankOf(n));
  const columns = new Map();
  for (const n of names) {
    const r = rank.get(n);
    if (!columns.has(r)) columns.set(r, []);
    columns.get(r).push(n);
  }
  const W = 108, H = 30, GX = 30, GY = 14;
  const place = new Map();
  for (const [r, members] of columns) {
    members.forEach((n, i) => {
      place.set(n, { x: r * (W + GX), y: i * (H + GY), w: W, h: H });
    });
  }
  const width = Math.max(...[...place.values()].map((p) => p.x + p.w), W);
  const height = Math.max(...[...place.values()].map((p) => p.y + p.h), H);
  return { place, width, height };
}

function graphSvg(lane) {
  const { place, width, height } = layout(lane.nodes, lane.edges);
  const byName = new Map(lane.nodes.map((n) => [n.name, n]));
  const doneish = new Set(lane.nodes.filter((n) => n.state === "done").map((n) => n.name));
  const current = lane.nodes.find((n) => n.state === "current" || n.state === "blocked");
  const parts = [];
  for (const e of lane.edges) {
    const a = place.get(e.from), b = place.get(e.to);
    if (!a || !b) continue;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    const mid = (x1 + x2) / 2;
    const d = `M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`;
    const live = lane.attention === "running" && current && e.to === current.name;
    const cls = live ? "edge live" : doneish.has(e.to) ? "edge hot" : "edge";
    parts.push(`<path class="${cls}" d="${d}"/>`);
  }
  for (const [name, p] of place) {
    const node = byName.get(name) || { state: "unknown" };
    const sel = state.node && state.node.task === lane.id && state.node.step === name ? " sel" : "";
    parts.push(
      `<g class="node ${node.state}${sel}" data-task="${esc(lane.id)}" data-step="${esc(name)}" tabindex="0" role="button" aria-label="${esc(name)}, ${esc(node.state)}">` +
      `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>` +
      `<text x="${p.x + 11}" y="${p.y + p.h / 2}">${esc(name)}</text></g>`);
  }
  return `<svg class="graph" viewBox="-2 -2 ${width + 4} ${height + 4}" style="max-width:${width + 4}px" role="img" aria-label="flow graph for ${esc(lane.id)}">${parts.join("")}</svg>`;
}

function laneBody(lane) {
  const said = lane.last_event ? lane.last_event.text : null;
  const bits = [];
  if (lane.agent?.harness) bits.push(esc(lane.agent.harness) + (lane.agent.model ? " · " + esc(lane.agent.model) : ""));
  if (lane.agent?.mode) bits.push(esc(lane.agent.mode));
  if (lane.pr) bits.push(`<a href="${esc(lane.pr)}" target="_blank" rel="noreferrer" style="color:var(--accent)">pull request</a>`);
  return `<div class="body">
    ${graphSvg(lane)}
    <div class="tools">
      ${bits.length ? `<span class="chip">${bits.join(" · ")}</span>` : ""}
      <button class="tool" data-act="steer" data-task="${esc(lane.id)}">Steer</button>
      <button class="tool" data-act="interrupt" data-task="${esc(lane.id)}">Interrupt</button>
      <button class="tool danger" data-act="exit" data-task="${esc(lane.id)}">Stop</button>
      <button class="tool" data-act="narrative" data-task="${esc(lane.id)}">Full narrative</button>
    </div>
    <form class="steer" data-task="${esc(lane.id)}">
      <input name="text" placeholder="One short line for this worker" autocomplete="off">
      <button class="tool" type="submit">Send</button>
    </form>
    ${said ? `<div class="hint" style="padding-top:12px">Last said: ${esc(said).slice(0, 400)}</div>` : ""}
    <div class="log" data-log="${esc(lane.id)}" hidden></div>
  </div>`;
}

function laneCard(lane) {
  const open = state.open === lane.id ? " open" : "";
  const activity = lane.activity;
  const said = activity
    ? (lane.attention === "armed" ? "brief delivered, no activity yet"
      : activity.state === "unknown" ? "activity unknown - " + activity.detail
      : activity.state)
    : "";
  const where = lane.step || (lane.record_state === "ok" ? "not started" : "unreadable record");
  return `<div class="lane${open}" data-lane="${esc(lane.id)}">
    <button class="row" data-toggle="${esc(lane.id)}" aria-expanded="${open ? "true" : "false"}">
      <span class="dot ${esc(lane.attention)}"></span>
      <span class="name">${esc(lane.id)}</span>
      <span class="said">${esc(said)}</span>
      <span class="meta"><span class="chip">${esc(where)}</span><span class="age">${ago(lane.step_ts)}</span></span>
    </button>
    ${laneBody(lane)}
  </div>`;
}

function render() {
  const main = $("main");
  if (!state.meta.ready) {
    main.innerHTML = `<p class="hint">Projecting the board from the records… this is the one slow read, and it happens once.</p>`;
    return;
  }
  const healthy = state.lanes.filter((l) => l.attention !== "record");
  const records = state.lanes.filter((l) => l.attention === "record");
  const out = [];
  for (const [key, title] of GROUPS) {
    const group = healthy.filter((l) => l.attention === key);
    if (group.length === 0) continue;
    out.push(`<h2>${title}<span class="n">${group.length}</span></h2>`);
    out.push(group.map(laneCard).join(""));
  }
  if (out.length === 0) out.push(`<p class="hint">No readable flows in this home yet.</p>`);
  // Unknown is stated rather than hidden, but it is mostly finished or torn-down
  // work, so it is one line until asked for instead of the loudest section.
  const unknown = healthy.filter((l) => l.attention === "unknown");
  if (unknown.length > 0) {
    out.push(`<details class="records"><summary>Activity unknown (${unknown.length}) - no instrument could answer for these, which is not the same as quiet</summary>${unknown.map(laneCard).join("")}</details>`);
  }
  if (records.length > 0) {
    out.push(`<details class="records"><summary>Records needing attention (${records.length}) - these lanes cannot be read, they are not stalled work</summary>${records.map(laneCard).join("")}</details>`);
  }
  main.innerHTML = out.join("");
  setAge();
}

function setAge() {
  const live = $("pulse").classList.contains("on");
  $("age").textContent = `${live ? "live" : "stream down"} · graph projected ${ago(state.meta.board_at)} · agents ${ago(state.meta.snapshot_at)}`;
}

function applyBoard(board) {
  state.meta = board;
  state.lanes = board.lanes;
  render();
}

function applyLane(lane) {
  const at = state.lanes.findIndex((l) => l.id === lane.id);
  if (at >= 0) state.lanes[at] = lane; else state.lanes.push(lane);
  render();
}

// --- interactions ------------------------------------------------------------

document.addEventListener("click", async (event) => {
  const toggle = event.target.closest("[data-toggle]");
  if (toggle) {
    const id = toggle.dataset.toggle;
    state.open = state.open === id ? null : id;
    state.node = null;
    render();
    return;
  }
  const node = event.target.closest("g.node");
  if (node) {
    openNodeLog(node.dataset.task, node.dataset.step);
    return;
  }
  const act = event.target.closest("[data-act]");
  if (act) {
    const task = act.dataset.task;
    if (act.dataset.act === "steer") {
      const form = document.querySelector(`.steer[data-task="${CSS.escape(task)}"]`);
      form.classList.toggle("on");
      if (form.classList.contains("on")) form.querySelector("input").focus();
      return;
    }
    if (act.dataset.act === "narrative") return openNarrative(task);
    if (!confirm(`${act.dataset.act === "exit" ? "Stop" : "Interrupt"} ${task}?`)) return;
    await postAction({ task, action: act.dataset.act });
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "/" && event.target === document.body) {
    event.preventDefault();
    $("q").focus();
  }
  if (event.key === "Escape") $("sheet").classList.remove("on");
  if (event.key === "Enter" && event.target.closest("g.node")) {
    const n = event.target.closest("g.node");
    openNodeLog(n.dataset.task, n.dataset.step);
  }
});

document.addEventListener("submit", async (event) => {
  const steer = event.target.closest(".steer");
  if (steer) {
    event.preventDefault();
    const input = steer.querySelector("input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    steer.classList.remove("on");
    await postAction({ task: steer.dataset.task, action: "steer", text });
    return;
  }
  if (event.target.id === "askform") {
    event.preventDefault();
    const input = $("ask");
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    const body = { question };
    if (state.open) body.task = state.open;
    const reply = await (await fetch("/api/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })).json();
    toast(reply.delivered
      ? "Delivered to firstmate. The answer comes back in your firstmate session, not here."
      : `Not delivered: ${reply.output || reply.error || "unknown"}`);
  }
});

async function postAction(body) {
  const reply = await (await fetch("/api/action", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })).json();
  toast(reply.ok ? `${body.action}: done · ${reply.invoked}` : `${body.action} failed: ${reply.output || reply.error || "unknown"}`);
}

async function openNodeLog(task, step) {
  state.node = { task, step };
  render();
  const box = document.querySelector(`.log[data-log="${CSS.escape(task)}"]`);
  if (!box) return;
  box.hidden = false;
  box.innerHTML = `<div class="head">${esc(step)} · reading…</div>`;
  const log = await (await fetch(`/api/log?task=${encodeURIComponent(task)}&step=${encodeURIComponent(step)}`)).json();
  const head = `<div class="head"><b>${esc(step)}</b><span class="src">${esc(log.source)}</span></div>`;
  box.innerHTML = head + (log.entries?.length
    ? `<pre>${log.entries.map((e) => esc((e.ts ? e.ts + "  " : "") + e.text)).join("\n")}</pre>${log.note ? `<div class="empty">${esc(log.note)}</div>` : ""}`
    : `<div class="empty">${esc(log.note || "No durable source for this node.")}</div>`);
  box.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

async function openNarrative(task) {
  const box = document.querySelector(`.log[data-log="${CSS.escape(task)}"]`);
  if (!box) return;
  box.hidden = false;
  box.innerHTML = `<div class="head">narrative · reading…</div>`;
  const data = await (await fetch(`/api/status?task=${encodeURIComponent(task)}`)).json();
  const lines = (data.lines || []).map((l) => l.text).join("\n");
  const records = (data.records || []).map((r) => r.raw).join("\n");
  box.innerHTML = `<div class="head"><b>${esc(task)}</b><span class="src">status + record</span></div>` +
    (lines || records
      ? `<pre>${esc(lines)}${records ? "\n\n- transition record -\n" + esc(records) : ""}</pre>`
      : `<div class="empty">This task has written nothing durable yet.</div>`);
}

let searchTimer = null;
$("q").addEventListener("input", (event) => {
  clearTimeout(searchTimer);
  const query = event.target.value.trim();
  if (query.length < 2) return $("sheet").classList.remove("on");
  searchTimer = setTimeout(async () => {
    const data = await (await fetch(`/api/search?q=${encodeURIComponent(query)}`)).json();
    $("sheetin").innerHTML = `<h3>${data.hits?.length || 0} matches for “${esc(query)}”${data.truncated ? " (first 300)" : ""}</h3>` +
      (data.hits?.length
        ? data.hits.map((h) => `<div class="hit"><b>${esc(h.path || "")}${h.line ? ":" + h.line : ""}</b> ${esc(h.text)}</div>`).join("")
        : `<p class="hint">${esc(data.error || "Nothing matched.")}</p>`);
    $("sheet").classList.add("on");
  }, 220);
});

// --- live stream -------------------------------------------------------------

const stream = new EventSource("/events");
stream.addEventListener("board", (event) => applyBoard(JSON.parse(event.data)));
stream.addEventListener("lane", (event) => applyLane(JSON.parse(event.data)));
stream.onopen = () => { $("pulse").classList.add("on"); if (state.meta.ready) setAge(); };
stream.onerror = () => { $("pulse").classList.remove("on"); if (state.meta.ready) setAge(); };
setInterval(() => { if (state.meta.ready) setAge(); }, 5000);
</script>
</body>
</html>
