# Which repositories belong to which context brief.
#
# Copy this file to FM_HOME/config/context-briefs.conf and edit it by hand. The
# grouping is a human judgement about how work is thought about, so nothing
# derives it and nothing rewrites it.
#
# One line per context, written as "<context>: <repo>, <repo>". The context name
# is the file name of its brief under FM_HOME/data/briefs/, without the .md, so
# "back-office" below regenerates data/briefs/back-office.md.
#
# A repository may be written as "name" or "owner/name" and is matched without
# regard to case, which is what lets one line cover the several spellings the
# backlog and the task records use for the same repository. A repository that
# appears in the records but on no line here is reported as an explicit unmapped
# line each time the generator runs, rather than being silently dropped.
#
# Blank lines and lines starting with # are ignored.

back-office: mldinvoicing, mldaccounts, mld-bi
growth: mld-website, MLDExpansion
the-machine: firstmate, transformation
