# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Pin lint and test to the SAME deterministic commands CI runs, instead of
# leaving them to no-mistakes' default handling. Without a configured
# commands.lint, the gate's lint step never ran the deterministic
# `shellcheck bin/*.sh bin/backends/*.sh tests/*.sh` that CI runs, so info-level
# ShellCheck findings (e.g. SC2015) were not surfaced locally before CI rejected
# them. commands.lint delegates the shell definition to bin/fm-lint.sh and runs
# the locked Agent Fleet ruff check that .github/workflows/ci.yml also invokes.
# The shell definition stays single-owned, so local and CI cannot diverge
# (parity asserted by tests/fm-lint.test.sh).
# The test command mirrors the source checks in .github/workflows/ci.yml:
# route every behavior test through tests/run.sh's sealed admission boundary,
# then run Agent Fleet's locked pytest and compileall checks, and fail if any
# check exits non-zero. The e2e tests need tmux on PATH, which the firstmate
# environment provides.
# Local and CI cannot diverge on the admission a test receives: CI fans the same
# inventory across eight shards, and bin/fm-behavior-shards.sh admits every path
# it selects through tests/run.sh, so both routes cross this same boundary.
# This command keeps the single serial runner rather than reproducing that
# concurrent fan-out locally, because the two routes differ in exactly one way
# that matters here: CI shards select the explicit non-Herdr path
# (FM_TEST_SKIP_HERDR=1) because their disposable image carries no Herdr, while
# this gate never skips, so every real-Herdr declaration provisions an owned
# Herdr lab and the serial route holds those labs to one at a time.
commands:
  lint: 'bin/fm-lint.sh && uv run --directory tools/agent-fleet --locked ruff check .'
  test: 'command -v tmux >/dev/null || { echo "tmux is required for e2e tests" >&2; exit 1; }; tmux -V; rc=0; tests/run.sh || rc=1; uv run --directory tools/agent-fleet --locked pytest || rc=1; uv run --directory tools/agent-fleet --locked python -m compileall -q src || rc=1; exit "$rc"'

# Keep test evidence out of this repo; it stays in a temp dir instead.
test:
  evidence:
    store_in_repo: false
