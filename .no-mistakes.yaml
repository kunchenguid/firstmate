# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Pin lint and test to the SAME deterministic commands CI runs, instead of
# leaving them to no-mistakes' default handling. Without a configured
# commands.lint, the gate's lint step never ran the deterministic ShellCheck
# CI runs, so info-level findings were not surfaced locally before CI rejected
# them. The scoped owner below uses the same reviewed Azure-service selector as
# CI: focused diffs lint only changed shell files, while mixed or unknown diffs
# run the complete canonical set. Both modes delegate to bin/fm-lint.sh and
# always run the locked Agent Fleet ruff check. The shell definition remains
# single-owned (parity asserted by tests/fm-lint.test.sh).
# The ordinary local test command derives every herdr-lab and herdr-mixed file
# from tests/test-capabilities.tsv, admits those files through tests/run.sh's
# sealed safety and lab-ownership boundary, and runs them serially on the
# real-Herdr path concurrently with Agent Fleet's locked pytest and compileall
# checks.
# It deliberately does not duplicate hermetic-only behavior files on the Mac.
# The required Behavior tests CI job owns the complete behavior inventory:
# eight isolated runners admit every selected path through tests/run.sh, run
# every hermetic body plus the hermetic portion of the mixed file, and verify
# the exact complete executed-manifest union after all shards finish.
# Local real-Herdr execution plus required CI is therefore the complete
# behavioral coverage contract; local pre-push does not claim all 123 files.
# The dispatch wrapper is local by default.
# An operator may opt an exact command class into the private Azure runner; once
# selected remote, a cloud or result failure is returned without local fallback.
# A Firstmate no-mistakes Azure worker is already the isolated test boundary.
# It runs the focused service suite owned by bin/fm-azure-service-test-scope.py
# directly and never dispatches a nested validation fleet or Herdr lab.
# Inside an admitted validation cell, the trusted default-branch command string
# bypasses worktree scripts and delegates lint plus every behavior shard to the
# root-owned bridge, so command children receive neither provider nor GitHub
# credentials and never execute on the credentialed coordinator VM.
# tests/fm-azure-runner.test.sh executes this test command in an isolated fixture
# and proves that its two branches exclusively reach those respective owners.
commands:
  lint: 'if [ "${FM_AZURE_VALIDATION_CELL:-0}" = 1 ]; then exec "$FM_AZURE_VALIDATION_SHARD_BRIDGE" lint -- bin/fm-azure-runner-command.sh bin/fm-no-mistakes-lint-command.sh; else exec bin/fm-azure-runner-dispatch.sh lint -- bin/fm-azure-runner-command.sh bin/fm-no-mistakes-lint-command.sh; fi'
  test: 'if [ "${FM_AZURE_VALIDATION_CELL:-0}" = 1 ]; then exec "$FM_AZURE_VALIDATION_SHARD_BRIDGE" behavior --count "${FM_AZURE_VALIDATION_SHARD_COUNT:-8}"; else exec bin/fm-no-mistakes-test-command.sh; fi'

# Keep test evidence out of this repo; it stays in a temp dir instead.
test:
  evidence:
    store_in_repo: false
