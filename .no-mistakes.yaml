# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Pin lint and test to the SAME deterministic commands CI runs, instead of
# leaving them to no-mistakes' default handling. Without a configured
# commands.lint, the gate's lint step never ran the deterministic
# `shellcheck bin/*.sh bin/backends/*.sh tests/*.sh` that CI runs, so info-level
# ShellCheck findings (e.g. SC2015) were not surfaced locally before CI rejected
# them. commands.lint delegates the shell definition to bin/fm-lint.sh and runs
# the locked Agent Fleet ruff check that .github/workflows/ci.yml also invokes.
# The shell definition stays single-owned, so local and CI cannot diverge
# (parity asserted by tests/fm-lint.test.sh).
# The test command mirrors the source checks in .github/workflows/ci.yml:
# every tests/*.test.sh, including the Python 3.11 Bridge cutover runner, then
# Agent Fleet's locked pytest and compileall checks, failing if any check exits
# non-zero. The e2e tests need tmux on PATH, which the firstmate environment
# provides.
# The behavior tests run through bin/fm-behavior-shards.sh, the SAME planner and
# runner .github/workflows/ci.yml uses, fanned out across its eight shards
# concurrently instead of one serial loop. This restores local-CI parity: CI has
# sharded these tests for some time while the local gate still iterated serially,
# so the serial loop was the divergence, not the fix. --verify re-checks that the
# executed union is complete and disjoint, exactly as CI does, so parallelism
# cannot silently drop a file.
# Each shard gets its own TMPDIR and TMUX_TMPDIR. This is mandatory, not tidiness:
# CI supplies one isolated runner per shard, and locally the e2e suites would
# otherwise share a tmux server and temp namespace and produce cross-shard flakes
# that read as real defects. Shard output is captured per shard and printed in
# order after the wait, so concurrent runs stay attributable rather than
# interleaved.
# Known and accepted: the planner balances on tests/behavior-test-durations.tsv,
# which holds CI weights that misrank local durations, so local shards are
# unbalanced. --check keeps the split complete and disjoint regardless, and an
# unbalanced eight-way split still beats a serial loop by a wide margin.
commands:
  lint: 'bin/fm-lint.sh && uv run --directory tools/agent-fleet --locked ruff check .'
  test: 'command -v tmux >/dev/null || { echo "tmux is required for e2e tests" >&2; exit 1; }; tmux -V; rc=0; base=$(mktemp -d); mdir="$base/manifests"; mkdir -p "$mdir"; pids=""; for s in 1 2 3 4 5 6 7 8; do ( TMPDIR="$base/$s/tmp"; TMUX_TMPDIR="$base/$s/tmux"; export TMPDIR TMUX_TMPDIR; mkdir -p "$TMPDIR" "$TMUX_TMPDIR"; bin/fm-behavior-shards.sh --run "$s" 8 "$mdir/executed-$s.tsv" >"$base/shard-$s.log" 2>&1 ) & pids="$pids $!"; done; for p in $pids; do wait "$p" || rc=1; done; for s in 1 2 3 4 5 6 7 8; do echo "== behavior shard $s/8 =="; cat "$base/shard-$s.log"; done; bin/fm-behavior-shards.sh --verify 8 "$mdir" || rc=1; rm -rf "$base"; uv run --directory tools/agent-fleet --locked pytest || rc=1; uv run --directory tools/agent-fleet --locked python -m compileall -q src || rc=1; exit "$rc"'

# Keep test evidence out of this repo; it stays in a temp dir instead.
test:
  evidence:
    store_in_repo: false
