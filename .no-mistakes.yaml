# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI runs instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns the complete lint definition, including GitHub workflow
# lint via pinned actionlint in `bin/fm-lint-workflows.sh`, and
# `.github/workflows/ci.yml` invokes it directly, with parity asserted by
# `tests/fm-lint.test.sh` and `tests/fm-lint-workflows.test.sh`.
#
# Pin the test baseline to the repository's own runner rather than leaving each
# gate agent to chain `bash tests/a.test.sh && bash tests/b.test.sh` by hand.
# `bin/fm-test-run.sh --changed` selects only the families the branch's changed
# files map to, runs concurrency-admitted scripts with bounded concurrency, keeps
# every unproven stateful script serial, and applies its own generous per-script
# bound - so a verification round is neither a guessed short timeout nor a
# serial chain. `bin/fm-test-run.sh` owns all of that (see its header).
#
# real-herdr-gated is excluded for the same reason the portable CI lanes exclude
# it: those scripts drive a live Herdr lab, and the dedicated required Herdr lane
# in .github/workflows/ci.yml owns that coverage. A gate baseline must not start
# real Herdr sessions on whatever machine it happens to run on.
#
# This is still NOT a complete tests/*.test.sh walk, and must not become one.
# Local no-mistakes Test is intent-targeted validation of whether the change
# meets its brief; .github/workflows/ci.yml owns broad regression (behavior
# suite, platform, security, Herdr, tmux, and lifecycle coverage). A full-suite
# override here would duplicate CI and defeat the targeted Test contract. The
# configured command is a baseline only: because firstmate always supplies
# --intent, the Test step still runs its intent-targeted evidence agent on top
# of it.
commands:
  lint: 'bin/fm-lint.sh'
  test: 'bin/fm-test-run.sh --changed --exclude-family real-herdr-gated'

# Publish each run's test evidence to the orphan no-mistakes/evidence branch linked from the PR.
# The evidence is not committed to the feature or default branch.
test:
  evidence:
    store_in_repo: true

# Raise the Review-stage agent bound from its 30m default.
#
# Measured on this branch, 2026-09-01. The Review step for run
# 01M1E1CQ2S1PYQKGVMKZ35QVJP recorded 2,236,972 ms total (37.3 min): the initial
# review completed and gated in roughly 7.3 min, and the review-fix turn then
# consumed the entire remaining 30m0s bound and was KILLED while still producing
# output 1 second earlier ("agent fix timed out after 30m0s ... agent last
# produced output 1s ago (122 observed)"). So the fix turn dominates this stage,
# and 30m is a hard cut through live work rather than a stalled-agent backstop.
# For contrast, a healthy fix turn on the preceding run was still progressing at
# 630,675 ms (10.5 min) and did complete, so the default is adequate on a
# responsive machine and only fails when the machine degrades.
#
# 60m is twice the observed hard cut and roughly six times a healthy fix turn.
# The true requirement of the killed turn is UNMEASURED - it was cut off, not
# finished - so this is sized against the cut, not against a completion.
#
# Repo-local and deliberately not global: this compensates for slow local
# hardware on this repository's runs, and the stalled-agent protection the
# default provides is preserved, just at a bound that does not sever work in
# progress.
review_agent_timeout: "60m"
