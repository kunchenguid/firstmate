# Per-repo no-mistakes overrides.

# Gate agents must not load firstmate's project-level captain instructions. The
# lifecycle entrypoints also refuse the stamped gate marker and gate-repo path.
disable_project_settings: true

# Run the focused isolation and endpoint tests through the local runner instead
# of delegating to an agent.
commands:
  lint: 'bin/fm-install-shellcheck.sh "${TMPDIR:-/tmp}/fm-shellcheck-$$/bin" && PATH="${TMPDIR:-/tmp}/fm-shellcheck-$$/bin:$PATH" bin/fm-lint.sh'
  test: 'bash tests/fm-worker-isolation.test.sh && bash tests/fm-slot-occupant-proof.test.sh && bash tests/fm-spawn-route.test.sh && bash tests/fm-teardown.test.sh'

# Keep test evidence out of this repo; it stays in a temp dir instead.
test:
  evidence:
    store_in_repo: false
