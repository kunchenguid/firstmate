[project]
name = "graph-intelligence"
version = "0.4.0"
description = "Universal Agent Skill: 15 deterministic graph algorithms with dual-mode (import + CLI) execution, zero-copy filtering, and temporal slicing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel.packages]
"core" = "core"
"scripts" = "scripts"
