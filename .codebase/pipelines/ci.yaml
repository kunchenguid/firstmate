# Codebase CI (code.byted.org). This is the pipeline that actually runs on MRs.
#
# .github/workflows/ci.yml holds the same lanes for the GitHub mirror, which
# still owns releases and Pages. Neither file runs on the other's host, so keep
# the two in step when you change one.
#
# Each job surfaces on the MR as a check run named
# "[Pipeline] MR CI - <job name>", which is what no-mistakes reads through
# `bytedcli codebase mr status`.
#
# WHY THE BEHAVIOR SUITE IS SHARDED HERE. It used to be one job running every
# lane back to back under a 30-minute cap. The 2026-08-11 upstream sync grew the
# suite from ~130 to 160 scripts, and that job then died at the cap with 111 of
# them started and no summary for the rest - a timeout reported as
# "job context marshal fail", which says nothing about what was still running.
# The lanes are now separate jobs, matching the GitHub workflow: each finishes
# in minutes, each reports its own result, and the per-job cap goes back to
# being a hang tripwire rather than the expected end of the run.
#
# Lane membership and the serial shard COUNT both belong to bin/fm-test-run.sh
# (docs/fm-test-portable-shards.md), which refuses a lane whose "ofN" disagrees
# with it - so dropping a shard job here fails loudly instead of quietly leaving
# a quarter of the required lane unrun.
#
# The image toolchain repair every behavior job needs is owned by
# bin/fm-ci-codebase-setup.sh, and the non-root plus hermetic-git contract the
# runner needs is owned by bin/fm-ci-codebase-lane.sh. Read those two headers
# before changing anything about the environment.
name: MR CI

trigger:
  change:
    branches: [main]
    # create + push only, deliberately: `update` also fires on MR metadata edits,
    # so editing the description would re-run the whole suite. This mirrors the
    # GitHub workflow, which triggers on code changes rather than PR edits.
    types: [create, push]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint shell scripts
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    timeout: 20
    steps:
      # The pinned build, its checksum, and its version all belong to
      # bin/fm-install-shellcheck.sh; only the relay proxy is added here,
      # because github.com is not directly reachable from this runner.
      - name: Install pinned ShellCheck
        commands:
          - |
            set -eu
            relay=http://sys-proxy-rd-relay.byted.org:8118
            https_proxy=$relay http_proxy=$relay bin/fm-install-shellcheck.sh /usr/local/bin
            shellcheck --version
      # Call the one owner of the lint definition rather than re-spelling its
      # globs here. This file's copy had drifted: it omitted control-root/, so
      # the scripts deployed to relay task hosts were never linted by the gate
      # that actually runs on MRs, and a test sourcing one of them failed with
      # SC1091 "not specified as input" - a finding about the file SET, not
      # about the code. bin/fm-lint.sh also passes --norc, which this did not.
      - name: Shellcheck
        commands:
          - bin/fm-lint.sh

  # Deterministic proof that the portable parallel shards, the portable serial
  # shards, and the Herdr family together equal the complete tests/*.test.sh
  # inventory with no missing scripts and no duplicates. Pure listing, so it
  # needs none of the image repair the lanes below do.
  coverage:
    name: Test coverage guard
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    timeout: 10
    steps:
      - name: Prove complete regression partition
        commands:
          - bin/fm-test-run.sh --check-coverage

  # Two duration-balanced shards of the proven-isolated set (11 and 13 scripts).
  tests-parallel-1:
    name: Behavior portable parallel 1
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    # Hang tripwire with margin, not the expected healthy end of the lane.
    timeout: 20
    steps:
      - name: Provision image
        commands:
          - bin/fm-ci-codebase-setup.sh
      - name: Run portable parallel shard 1
        commands:
          - bin/fm-ci-codebase-lane.sh --lane portable-parallel-1

  tests-parallel-2:
    name: Behavior portable parallel 2
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    timeout: 20
    steps:
      - name: Provision image
        commands:
          - bin/fm-ci-codebase-setup.sh
      - name: Run portable parallel shard 2
        commands:
          - bin/fm-ci-codebase-lane.sh --lane portable-parallel-2

  # The required portable serial remainder: watcher, lock, AFK, tmux, daemon,
  # ambiguous, and other stateful scripts (~30 each). Split across separate jobs
  # so no two of them ever share a machine; each shard is still strictly serial
  # in itself.
  tests-serial-1:
    name: Behavior portable serial 1
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    timeout: 30
    steps:
      - name: Provision image
        commands:
          - bin/fm-ci-codebase-setup.sh
      - name: Run portable serial shard 1
        commands:
          - bin/fm-ci-codebase-lane.sh --lane portable-serial-1of4

  tests-serial-2:
    name: Behavior portable serial 2
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    timeout: 30
    steps:
      - name: Provision image
        commands:
          - bin/fm-ci-codebase-setup.sh
      - name: Run portable serial shard 2
        commands:
          - bin/fm-ci-codebase-lane.sh --lane portable-serial-2of4

  tests-serial-3:
    name: Behavior portable serial 3
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    timeout: 30
    steps:
      - name: Provision image
        commands:
          - bin/fm-ci-codebase-setup.sh
      - name: Run portable serial shard 3
        commands:
          - bin/fm-ci-codebase-lane.sh --lane portable-serial-3of4

  tests-serial-4:
    name: Behavior portable serial 4
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    timeout: 30
    steps:
      - name: Provision image
        commands:
          - bin/fm-ci-codebase-setup.sh
      - name: Run portable serial shard 4
        commands:
          - bin/fm-ci-codebase-lane.sh --lane portable-serial-4of4

  # The real-Herdr family. Herdr is not installed on this image, so these
  # scripts report "skip: herdr not found" and the lane proves only that they
  # still gate cleanly; the GitHub workflow owns the real-Herdr run with a
  # pinned install and --fail-on-gate-skip.
  tests-herdr-gated:
    name: Behavior Herdr-gated family
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    timeout: 20
    steps:
      - name: Provision image
        commands:
          - bin/fm-ci-codebase-setup.sh
      - name: Run the Herdr-gated family
        commands:
          - bin/fm-ci-codebase-lane.sh --family real-herdr-gated

  invariants:
    name: Repo invariants
    runs-on:
      env: boe
    image: hub.byted.org/codebase/ci_nodejs_20:latest
    timeout: 10
    steps:
      - name: Symlinks must stay intact
        commands:
          - |
            set -eu
            [ "$(readlink CLAUDE.md)" = "AGENTS.md" ] || { echo "CLAUDE.md must be a symlink to AGENTS.md"; exit 1; }
            [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo ".claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        commands:
          - |
            set -eu
            tracked=$(git ls-files -- data state config projects .no-mistakes)
            if [ -n "$tracked" ]; then
              echo "Personal fleet paths are tracked in git:"
              printf '%s\n' "$tracked"
              exit 1
            fi
