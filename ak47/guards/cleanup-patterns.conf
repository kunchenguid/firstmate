# ak47/guards/cleanup-patterns.conf - the static half of the producer guard.
#
# One row per producer file: id|file|create-pattern|cleanup-pattern
#   file      repo-relative, resolved under --projects (default $FM_HOME/projects)
#   create    an ERE that proves the file creates temp state
#   cleanup   an ERE that proves the file removes it
#
# The guard fails when a file matches `create` and does not match `cleanup`.
# That is the whole test: a file that makes temp state and never removes it is
# the producer, and the guard is what stops the source fix from rotting back.
#
# A row whose file is absent from the checkout is SKIPPED, not failed: the guard
# runs on whatever projects this home has cloned, and a missing clone is not
# evidence of a leak.
#
# Measured 2026-11-10: every row below matched `create` and none matched
# `cleanup`, which is why /tmp held 950,700 entries at 14% disk.

# --- hydra: 41 of 59 scripts/tests/*.py files leak, 126 mkdtemp sites -----------
uvn|hydra/scripts/tests/test_uvn_status.py|mkdtemp\(|addCleanup\(|rmtree\(|tearDownClass
wc|hydra/scripts/tests/test_uvn_status.py|mkdtemp\(|addCleanup\(|rmtree\(|tearDownClass
uvn-lens|hydra/scripts/tests/test_fraud_lens.py|mkdtemp\(|addCleanup\(|rmtree\(|tearDownClass
merge-outcome|hydra/scripts/tests/test_merge_outcome_notify.py|mkdtemp\(|addCleanup\(|rmtree\(|tearDownClass
irc|hydra/scripts/tests/test_intercom_reconcile.py|mkdtemp\(|addCleanup\(|rmtree\(|tearDownClass

# --- core-backend: bare files in os.tmpdir(), never unlinked --------------------
rmtc|core-backend/src/commands/repairMissingTrackCredits.test.js|mkdtempSync\(|rmSync\(|afterEach\(|afterAll\(
rmtc-artifacts|core-backend/src/commands/repairMissingTrackCredits.test.js|mkdtempSync\(|rmSync\(|afterEach\(|afterAll\(
restore-test|core-backend/src/commands/restoreRevertedApprovals.test.js|os\.tmpdir\(\)|rmSync\(|unlinkSync\(|afterEach\(|afterAll\(
csv|core-backend/scripts/claim-surface-verify.test.js|os\.tmpdir\(\)|rmSync\(|unlinkSync\(|afterEach\(|afterAll\(

# --- H-DevOps: the 2026-11-10 fork bomb ----------------------------------------
# test-rebalance-wedge-scaleup-gate.sh:257 mktemp -d with a trap, :331 mktemp -d
# inside mutate() with rm -rf only on the normal path. The trap is the fix.
hdevops-scaleup-gate|H-DevOps/scripts/devops-agent/tests/test-rebalance-wedge-scaleup-gate.sh|mktemp -d|trap .*EXIT|rm -rf
