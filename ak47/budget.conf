# ak47/budget.conf - what "humming" means, as numbers.
#
# One row per ceiling: key|ceiling|max|min|unit|reason
#   max = a breach is a value ABOVE the ceiling
#   min = a breach is a value BELOW the ceiling
#
# Every ceiling carries the one-line reason it is that number. A ceiling without
# a reason is a number nobody can defend, and the weekly review is not allowed to
# move one without replacing its reason.
#
# status.sh renders this table against live samples into
# ~/.local/state/ak47/status.md. tick.sh evaluates the same rows to decide
# whether a run is silent. weekly-review.sh proposes diffs to this file and never
# applies them.
#
# Measured baseline, 2026-11-10: load15 14.2, swap 29%, RAM available 85 GB,
# /tmp 950,700 entries and 163 GB, root 14%, tmux server ~74% of one core,
# ~145 resident pi agents.

# --- CPU ---------------------------------------------------------------------
# 2x the 32 threads. Above this the box is not keeping up: every agent turn
# slows, and the 2026-11-10 lockup peaked at 452. 32 is the point where the
# scheduler is still draining work faster than it arrives.
load15|32|max|load|2x the 32 threads: above this the box is not keeping up and every agent turn slows

# --- memory ------------------------------------------------------------------
# The 2026-11-10 lockup sat at 99-100% swap while 77 GB of RAM was free, because
# swappiness 60 paged out idle agents. At 10 the kernel only swaps under real
# pressure, so 50% is already a signal that something is holding memory it should
# have released.
swap_pct|50|max|%|the 2026-11-10 lockup ran at 99% swap with 77 GB RAM free; 50% means real pressure, not idle paging
# 15 GB is the headroom one full test suite plus a browser needs. Below it a
# single heavy run can push the box into reclaim and stall every agent at once.
mem_avail_gb|15|min|GB|one full test suite plus a browser needs ~15 GB; below it a single run can stall every agent

# --- /tmp --------------------------------------------------------------------
# The measured problem is entry count, not bytes: 950,700 entries made every
# glob, ls, find and test run slow while the disk was only 14% full. 200,000 is
# the acceptance ceiling and roughly the point where a top-level readdir stays
# under a second.
tmp_entries|200000|max|entries|950k entries slowed every glob and test run at 14% disk; 200k keeps a top-level readdir under a second
# 20 GB is the scratch a week of live work needs. The 163 GB today is leaked test
# scratch, not work in progress.
tmp_gb|20|max|GB|a week of live scratch fits in 20 GB; the 163 GB today is leaked test scratch, not work in progress

# --- disk --------------------------------------------------------------------
# 85% is where ext4 starts fragmenting badly and a single large build can fill
# the volume. The root is 3.6 TB, so 85% is still 540 GB of headroom.
root_disk_pct|85|max|%|ext4 fragments badly past 85% and one large build can fill the volume; 540 GB of headroom remains

# --- the fleet's own overhead ------------------------------------------------
# The tmux server is the fleet's spine and costs a permanent ~74% of one core
# with 81 panes. 100% (one whole core) is the point where it is competing with
# real work rather than idling alongside it. Measured, never signalled.
tmux_core_pct|100|max|% of one core|the tmux server idles at ~74% of one core with 81 panes; a whole core means it is competing with real work
# 160 resident pi agents at 90 MB-1.7 GB each. Past this the per-agent CPU share
# and the tmux server cost both cross into the load ceiling above.
agent_count|160|max|agents|160 agents at 90 MB-1.7 GB each is where per-agent CPU share and tmux cost cross the load ceiling
