---
# ak47 — the factory workstation, not a cluster node.
#
# ak47 is deliberately NOT in inventory/prod: it is not part of the OVH vRack,
# it has no cluster ClusterIP route, and nothing here should ever be applied to
# a node. It is a single local host, reached with ansible_connection: local, so
# this playbook runs on the box itself and needs no SSH.
#
# Usage:
#   ansible-playbook -i inventory/local playbooks/07-ak47-hygiene.yml --check --diff
#   ansible-playbook -i inventory/local playbooks/07-ak47-hygiene.yml
all:
  hosts:
    ak47:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
      # The user that owns the systemd --user session the timers live in.
      ak47_user: aaron
      ak47_home: /home/aaron
      # Where the hygiene scripts live. They ship with firstmate, not with this
      # repo: H-DevOps carries the deployment, firstmate carries the code.
      ak47_repo: /home/aaron/Projects/firstmate
