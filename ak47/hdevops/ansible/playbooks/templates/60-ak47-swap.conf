# ak47 swap behaviour (2026-11-10).
# Default swappiness 60 paged ~20 GB of 275 idle pi processes to disk while
# 77 GB of RAM sat available, so swap ran at 99-100% and every wake paid a
# page-in. 10 keeps anonymous pages resident and reclaims page cache first.
# Revert: sudo rm /etc/sysctl.d/60-ak47-swap.conf && sudo sysctl -w vm.swappiness=60
vm.swappiness = 10
