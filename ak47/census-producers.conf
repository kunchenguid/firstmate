# ak47/census-producers.conf - who creates the /tmp growth, and how it is stopped.
#
# One row per producer: id|match|pattern|owner|source-fix|guard
#   match   prefix  = the entry name starts with pattern
#           regex   = the entry name matches the ERE pattern
#   owner   the file that creates the entry (repo-relative where known)
#   source-fix  what stops it AT SOURCE, not what sweeps it up afterwards
#   guard   the check that fails when the producer stops cleaning up
#
# census.sh counts every /tmp entry against this table and reports the
# "unattributed" remainder. A producer row whose count keeps growing is a
# producer whose source fix has not landed or has rotted; that is what
# guards/guard-producers.sh exists to catch.
#
# Measured 2026-11-10 on ak47, 950,700 top-level /tmp entries:
#   py-mkdtemp   464,620   sh-mktemp   366,410   uvn-        46,882
#   restore-test   5,544   merge-outcome 3,672   csv-         3,105
#   wc-            2,395   twin-req     2,237      puppeteer    1,906
#   irc-           1,770   rmtc-artifacts 1,494   uvn-lens       534
#   unattributed  ~54,000
#
# The two dominant rows are not a bug in one test: they are the default temp
# directory of every Python and every shell test suite on the box. The source fix
# for both is the same and it is systemic - a per-task TMPDIR (bin/fm-spawn.sh)
# so a leak lands in the task's own scratch root, which teardown already removes.

# --- the two systemic producers -------------------------------------------------
# Python's tempfile.mkdtemp() with no prefix: /tmp/tmp + 8 random characters.
# Python's _RandomNameSequence draws from [a-z0-9_], so the underscore is part of
# the alphabet: 91,115 of the 464,620 measured names contain one.
py-mkdtemp|regex|^tmp[a-z0-9_]{8}$|every Python test suite (hydra scripts/tests/*.py, core-backend *.test.js)|per-task TMPDIR in bin/fm-spawn.sh, plus addCleanup(shutil.rmtree) in the suite|ak47/guards/guard-producers.sh py-mkdtemp
# Shell's mktemp -d with no template: /tmp/tmp. + 10 random characters.
sh-mktemp|regex|^tmp\.[A-Za-z0-9]{10}$|every shell test suite (H-DevOps scripts/tests/*.sh, firstmate tests/*.sh)|per-task TMPDIR in bin/fm-spawn.sh, plus trap 'rm -rf "$WORK"' EXIT in the suite|ak47/guards/guard-producers.sh sh-mktemp

# --- named producers ------------------------------------------------------------
# hydra scripts/tests/test_uvn_status.py:224 - setUp() mkdtemp, tearDown() never removes it.
uvn|prefix|uvn-|hydra scripts/tests/test_uvn_status.py:224|addCleanup(shutil.rmtree, self.dir) in setUp|ak47/guards/guard-producers.sh uvn
# hydra scripts/tests/test_fraud_lens.py:233 - same shape.
uvn-lens|prefix|uvn-lens-|hydra scripts/tests/test_fraud_lens.py:233|addCleanup(shutil.rmtree, self.dir) in setUp|ak47/guards/guard-producers.sh uvn-lens
# hydra scripts/tests/test_merge_outcome_notify.py:109 - same shape.
merge-outcome|prefix|merge-outcome-|hydra scripts/tests/test_merge_outcome_notify.py:109|addCleanup(shutil.rmtree, self.dir) in setUp|ak47/guards/guard-producers.sh merge-outcome
# hydra scripts/tests/test_uvn_status.py:1683 - a ledger dir created outside setUp.
wc|prefix|wc-|hydra scripts/tests/test_uvn_status.py:1683|addCleanup(shutil.rmtree, ...) at the creation site|ak47/guards/guard-producers.sh wc
# hydra scripts/tests/test_intercom_reconcile.py:370 - same shape.
irc|prefix|irc-|hydra scripts/tests/test_intercom_reconcile.py:370|addCleanup(shutil.rmtree, self.dir) in setUp|ak47/guards/guard-producers.sh irc
# core-backend src/commands/repairMissingTrackCredits.test.js:127 - mkdtempSync, no removal.
rmtc|prefix|rmtc-|core-backend src/commands/repairMissingTrackCredits.test.js:127|afterEach(() => fs.rmSync(dir, {recursive:true, force:true}))|ak47/guards/guard-producers.sh rmtc
# core-backend src/commands/repairMissingTrackCredits.test.js:424 - same shape.
rmtc-artifacts|prefix|rmtc-artifacts-|core-backend src/commands/repairMissingTrackCredits.test.js:424|afterEach(() => fs.rmSync(dir, {recursive:true, force:true}))|ak47/guards/guard-producers.sh rmtc-artifacts
# core-backend src/commands/restoreRevertedApprovals.test.js:60 - a bare file in os.tmpdir().
restore-test|prefix|restore-test-|core-backend src/commands/restoreRevertedApprovals.test.js:60|afterEach(() => fs.rmSync(p, {force:true}))|ak47/guards/guard-producers.sh restore-test
# core-backend scripts/claim-surface-verify.test.js:26 - a bare file in os.tmpdir().
csv|prefix|csv-|core-backend scripts/claim-surface-verify.test.js:26|afterEach(() => fs.rmSync(f, {force:true}))|ak47/guards/guard-producers.sh csv
# Puppeteer/Playwright launch a fresh profile per browser and never remove it.
puppeteer|prefix|puppeteer_dev_chrome_profile-|puppeteer/playwright browser launches|launch with userDataDir under the task TMPDIR, or remove the profile in the suite's teardown|ak47/guards/guard-producers.sh puppeteer
# A mock-GitHub harness (state.json, calls.jsonl, port). Not present in any current
# checkout, so it is reported as unattributed until census.sh --watch names the
# live process that creates it. Kept as a row so a recurrence is counted, not lost.
twin-req|prefix|twin-req-|unattributed: mock-GitHub harness (state.json, calls.jsonl, port); no current checkout creates it|name the live producer with census.sh --watch, then fix it there|ak47/guards/guard-producers.sh twin-req
