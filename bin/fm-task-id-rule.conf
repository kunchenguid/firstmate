# fm-task-id-rule.conf - the fm- task-id prefix rule. This header is the
# contract home; docs/configuration.md "Task selectors" points here.
#
# ONE rule, read by exactly two loaders, with no third copy anywhere:
#   bash   bin/fm-task-id-rule-lib.sh - generic load code sourced by
#          bin/fm-backend.sh for the fm-send selector path and the
#          fm-control.sh label hint.
#   python bin/fm-jev-decisions.py - parses this file directly; no
#          subprocess, no embedded copy of the rule.
# tests/fm-task-id-rule.test.sh drives both real entry points (fm-send.sh
# selector resolution and the fm-jev-decisions CLI) over the id-shape table
# below and fails when their outcomes differ.
#
# The rule (compatibility baseline: the bash selector decisions that existed
# before this file, byte for byte):
#   1. A selector containing the reject token is never a task-id selector; it
#      stays an explicit backend endpoint escape hatch (session:window).
#   2. Candidate ids are derived in `candidates` order. `exact` is the
#      selector itself. `stripped` is the selector with exactly one leading
#      `prefix` removed, and is skipped when the selector does not carry the
#      prefix.
#   3. The first candidate with a state/<candidate>.meta record IS the task
#      id. With no matching record the selector is rejected.
#
# id-shape classes (the agreement test's table rows):
#   plain             alpha     -> exact candidate: state/alpha.meta wins.
#   fm-plain          fm-alpha  -> no state/fm-alpha.meta, so the stripped
#                                  candidate wins: task id alpha.
#   already-prefixed  fm-gamma  -> the exact candidate wins when the task's
#                                  own id carries the prefix
#                                  (state/fm-gamma.meta), so the id keeps its
#                                  prefix instead of being stripped.
#   malformed         fm-       -> strips to the empty id and no
#                                  state/.meta record exists: rejected.
#
# Format: line-based key=value, one pair per line, '#' starts a comment, no
# quoting or escaping, no whitespace around '='. Line-based rather than JSON
# because both loaders parse it directly with no subprocess: bash cannot read
# JSON without jq or python. The keys are exactly prefix, candidates, and
# reject_contains; a missing key, an unknown key, a duplicate key, an empty
# value, or a candidate transform outside {exact,stripped} fails the load
# closed, so no caller ever runs with a guessed rule.
#
# Scope: this file owns the task-id selector rule only: the strip and the
# accept/reject decision that turns a selector into a task id. Label
# formatting (label construction, the backend adapters' scoped titles and tab
# filters, classify's window-to-task fallback, fm-secondmate-restart argument
# parsing) is a separate rule that keeps its own literal "fm-"; changing
# `prefix` means grepping for that literal too.
# Proof the selector rule is single-sourced: fm-send's selector resolution and
# fm-jev-decisions read it only through the two loaders above, neither embeds
# a copy, and tests/fm-task-id-rule.test.sh fails when they disagree.

prefix=fm-
candidates=exact,stripped
reject_contains=:
