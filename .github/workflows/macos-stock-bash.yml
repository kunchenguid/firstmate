name: macOS stock Bash compatibility

on:
  pull_request:
    branches: [main]
    # This lane parses every tracked shell script, including test scripts, then
    # runs the focused stock-Bash contracts. Keep its filter native to Actions
    # so a PR's relevance is visible before a macOS runner is acquired.
    paths:
      - .github/workflows/macos-stock-bash.yml
      - bin/**
      - tests/**
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  macos-stock-bash:
    name: Stock macOS Bash runner compatibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run focused runner contract with stock Bash
        shell: /bin/bash {0}
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
        run: |
          set -eu
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "::error::expected stock macOS Bash 3.2.57, got $BASH_VERSION"; exit 1 ;;
          esac
          /bin/bash --version | head -1

          shell_inventory="$RUNNER_TEMP/fm-shell-inventory"
          bin/fm-lint.sh --list-files > "$shell_inventory"
          parse_fail=0
          while IFS= read -r f; do
            /bin/bash -n "$f" || { echo "::error::stock macOS Bash 3.2 failed to parse $f"; parse_fail=1; }
          done < "$shell_inventory"
          [ "$parse_fail" -eq 0 ] || { echo "::error::stock macOS Bash 3.2 parse sweep failed"; exit 1; }

          snapshot_output=$(/bin/bash tests/fm-fleet-snapshot-view.test.sh)
          printf '%s\n' "$snapshot_output"
          snapshot_count=$(printf '%s\n' "$snapshot_output" | grep -c '^ok - ')
          [ "$snapshot_count" -eq 15 ] || {
            echo "::error::expected 15 snapshot/fleet-view tests, got $snapshot_count"
            exit 1
          }

          bearings_output=$(/bin/bash tests/fm-bearings-snapshot.test.sh)
          printf '%s\n' "$bearings_output"
          bearings_count=$(printf '%s\n' "$bearings_output" | grep -c '^ok - ')
          [ "$bearings_count" -eq 41 ] || {
            echo "::error::expected 41 Bearings tests, got $bearings_count"
            exit 1
          }

          runner_test_output=$(bin/fm-test-run-stock-bash.sh)
          printf '%s\n' "$runner_test_output"
          runner_test_count=$(printf '%s\n' "$runner_test_output" | grep -c '^ok - ')
          [ "$runner_test_count" -eq 41 ] || {
            echo "::error::expected 41 focused runner contract tests, got $runner_test_count"
            exit 1
          }
