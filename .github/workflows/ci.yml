name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck bin/*.sh bin/backends/*.sh tests/*.sh

  bash32:
    name: Bash 3.2 parse check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Every script here runs via `#!/usr/bin/env bash`, and on stock macOS
      # that is /bin/bash 3.2.57, whose lexer chokes on constructs modern bash
      # accepts (e.g. an apostrophe inside a heredoc nested in `$(...)`, issue
      # #166). The runner's own bash is too new to catch that class, so this
      # job parses everything under the real 3.2 binary from the official
      # docker image - a true macOS-system-bash syntax gate.
      - name: Parse all shell scripts under bash 3.2.57
        run: |
          set -eu
          docker run --rm -v "$PWD:/repo:ro" bash:3.2.57 bash -c '
            set -u
            rc=0
            for f in /repo/bin/*.sh /repo/bin/backends/*.sh /repo/tests/*.sh; do
              bash -n "$f" || { echo "bash 3.2 parse failure: $f" >&2; rc=1; }
            done
            [ "$rc" = 0 ] && echo "bash 3.2 parse: all scripts OK"
            exit "$rc"
          '

  tests:
    name: Behavior tests
    runs-on: ubuntu-latest
    # The suite should finish in ~2-3 minutes; this generous cap fails loudly on a
    # hung watcher or tmux test instead of riding GitHub's 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - run: |
          set -eu
          for test_script in tests/*.test.sh; do
            "$test_script"
          done

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Symlinks must stay intact
        run: |
          set -eu
          [ "$(readlink CLAUDE.md)" = "AGENTS.md" ] || { echo "::error::CLAUDE.md must be a symlink to AGENTS.md"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
