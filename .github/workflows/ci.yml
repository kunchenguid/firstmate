name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede stale commits from the same PR or branch.
# The sole water-7 runner provides the fleet-wide one-job execution boundary.
concurrency:
  group: ci-water-7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FM_CI_MAX_LOAD: "12"

jobs:
  suite:
    name: Suite
    runs-on: [self-hosted, Linux, X64, water-7]
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
      github.event.repository.full_name == github.repository)
    timeout-minutes: 120
    env:
      LC_ALL: C
      LANG: C
      GIT_AUTHOR_NAME: Firstmate CI
      GIT_AUTHOR_EMAIL: firstmate-ci@users.noreply.github.com
      GIT_COMMITTER_NAME: Firstmate CI
      GIT_COMMITTER_EMAIL: firstmate-ci@users.noreply.github.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Admit suite only below the shared-host load ceiling
        run: bin/fm-ci-load-guard.sh wait --max-load "$FM_CI_MAX_LOAD" --timeout 900 --poll 15

      - name: Run the repository-owned serial CI policy
        env:
          FM_CI_FAST_LANE_BASE: ${{ github.event.pull_request.base.sha }}
        run: bin/fm-ci.sh

      - name: Refuse an overloaded suite verdict
        if: always()
        run: bin/fm-ci-load-guard.sh check --max-load "$FM_CI_MAX_LOAD"
