name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # no-mistakes creates the PR before it can append the completed-pipeline
      # attestation. Actions started by the initial open event receive that
      # earlier body, and GitHub does not dispatch a second pull_request event
      # when the same token updates it. Read the current body until the
      # attestation arrives, so this required check judges the final pipeline
      # metadata rather than the stale event payload.
      - name: Read current pull request body
        id: current-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          body=''
          for attempt in $(seq 1 30); do
            body=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .body)
            if [[ "$body" == *'<!-- no-mistakes-pipeline-attestation:v1 '* \
              && "$body" == *"\"head_sha\":\"$PR_HEAD_SHA\""* ]]; then
              break
            fi
            sleep 2
          done
          marker="no-mistakes-body-$(date +%s%N)-$RANDOM"
          {
            printf 'body<<%s\n' "$marker"
            printf '%s\n' "$body"
            printf '%s\n' "$marker"
          } >> "$GITHUB_OUTPUT"
      - name: Verify no-mistakes signature and pipeline attestation
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@32d396ac0f29135daf7fcb9964aba9d5f4e796d6 # post-v1.57.1, untagged (action added in #819)
        with:
          pr-body: ${{ steps.current-pr.outputs.body }}
          pr-head-sha: ${{ github.event.pull_request.head.sha }}
          pr-head-ref: ${{ github.event.pull_request.head.ref }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-number: ${{ github.event.pull_request.number }}
