# GATE STATE: stood-down since 2026-09-03 (no automatic pull_request trigger).
# no-mistakes was stood down for Artemis and Firstmate, so the automatic
# "Require no-mistakes" gate is reversibly disabled: the pull_request trigger
# below is commented out. The complete gate implementation (job body,
# admission condition, concurrency, permissions, and refusal logic) is
# retained in place, and independent review of the exact pull request head is
# what enforces the requirement meanwhile.
#
# workflow_dispatch is a real manual entry point, not a placeholder. It takes
# the pull request number as input, resolves that pull request's live head,
# author, and body from GitHub, and runs the same refusal contract the
# pull_request event runs.
#
# To revive the automatic gate, make all four edits in one change, or the
# suite goes red and this file contradicts itself:
#   1. Replace this whole header, GATE STATE line included, with the enforced
#      wording. A revived gate must not still describe itself as stood down.
#   2. Uncomment the pull_request trigger block below, keeping
#      workflow_dispatch and its input as the manual entry point.
#   3. Update the stand-down assertions and their descriptions in
#      tests/fm-ci-water7.test.sh, which currently require this workflow's
#      trigger set to be exactly {workflow_dispatch} and its GATE STATE line
#      to say stood-down.
#   4. Restore CONTRIBUTING.md's "Require no-mistakes" paragraph to its
#      enforced wording. The same test asserts that paragraph's declared
#      state agrees with this file's triggers.
name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number || inputs.pull_request }} body compliance - ${{ github.event.action || 'manual dispatch' }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Number of the pull request to check
        required: true
        type: string
  # pull_request:
  #   types: [opened, edited, synchronize, reopened]
  #   branches:
  #     - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number || inputs.pull_request }}-${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - name: Verify no-mistakes signature in PR body
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          body_file=$(mktemp)
          cleanup() { rm -f "$body_file"; }
          trap cleanup EXIT
          if [ "${EVENT_NAME:-}" = workflow_dispatch ]; then
            # A dispatch carries no pull_request payload, so resolve the same
            # four values that event supplies and let everything below run as
            # one contract for both events.
            case "${PR_NUMBER:-}" in
              ''|*[!0-9]*)
                echo "::error::A manual run needs the pull_request input set to a pull request number; got '${PR_NUMBER:-}'." >&2
                exit 1
                ;;
            esac
            if ! meta=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.head.repo.full_name, .user.login, .head.sha] | @tsv'); then
              echo "::error::Could not read pull request #${PR_NUMBER} in ${GITHUB_REPOSITORY}." >&2
              exit 1
            fi
            head_repo=$(printf '%s' "$meta" | cut -f1)
            PR_AUTHOR=$(printf '%s' "$meta" | cut -f2)
            PR_HEAD_SHA=$(printf '%s' "$meta" | cut -f3)
            if ! PR_BODY=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""'); then
              echo "::error::Could not read the body of pull request #${PR_NUMBER}." >&2
              exit 1
            fi
            if [ "$head_repo" != "${GITHUB_REPOSITORY}" ] ||
              [ "$PR_AUTHOR" = 'github-actions[bot]' ] ||
              [ "$PR_AUTHOR" = 'dependabot[bot]' ]; then
              echo "PR #${PR_NUMBER} is outside this gate's scope (fork head or exempt automation author); nothing to check."
              exit 0
            fi
            echo "Resolved PR #${PR_NUMBER} for manual dispatch: head ${PR_HEAD_SHA}, author ${PR_AUTHOR}."
          fi
          printf '%s' "${PR_BODY:-}" > "$body_file"
          if ! grep -qF -- "$marker" "$body_file"; then
            attempt=1
            while [ "$attempt" -le 12 ]; do
              if live=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .body 2>/dev/null); then
                printf '%s' "$live" > "$body_file"
                if grep -qF -- "$marker" "$body_file"; then
                  echo "Live PR body includes the no-mistakes signature (attempt ${attempt})."
                  break
                fi
              fi
              echo "Waiting for signed no-mistakes body (attempt ${attempt}/12)..."
              attempt=$((attempt + 1))
              sleep 10
            done
          fi
          if grep -qF -- "$marker" "$body_file"; then
            echo "Found no-mistakes signature in PR #${PR_NUMBER} body."
            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::This check requires jq to parse no-mistakes pipeline step attestation, but jq was not found on the runner." >&2
              exit 1
            fi
            prefix='<!-- no-mistakes-pipeline-attestation:v1 '
            suffix=' -->'
            body=$(cat "$body_file")
            json=''
            parse_ok=0
            case "$body" in
              *"$prefix"*)
                rest="${body#*"$prefix"}"
                case "$rest" in
                  *"$suffix"*)
                    json="${rest%%"$suffix"*}"
                    if printf '%s' "$json" | jq -e . >/dev/null 2>&1; then
                      parse_ok=1
                    fi
                    ;;
                esac
                ;;
            esac
            if [ "$parse_ok" -ne 1 ]; then
              {
                echo "::error::This repository requires no-mistakes >= 1.46.0; structured pipeline step attestation is missing or unparseable."
                echo
                echo "The no-mistakes signature was found, but this check also requires one"
                echo "HTML comment in the PR body:"
                echo
                echo '    <!-- no-mistakes-pipeline-attestation:v1 {"head_sha":"...","steps":[...]} -->'
                echo
                echo "That comment is emitted by no-mistakes >= 1.46.0 (the release that started"
                echo "emitting structured step attestation; see https://github.com/kunchenguid/no-mistakes/pull/670)."
                echo "An older no-mistakes that writes only the signature line is not enough."
                echo
                echo "Re-run the pipeline with 'git push no-mistakes' using no-mistakes >= 1.46.0."
                echo "See CONTRIBUTING.md for setup and the full workflow."
                echo
                echo "PR author: ${PR_AUTHOR}"
              } >&2
              exit 1
            fi
            attestation_head=$(printf '%s' "$json" | jq -er 'if (.head_sha | type) == "string" then .head_sha else empty end' 2>/dev/null) || attestation_head=''
            if [ -z "$attestation_head" ] || [ "$attestation_head" != "$PR_HEAD_SHA" ]; then
              {
                echo "::error::The no-mistakes pipeline attestation is not bound to this pull request head."
                echo
                echo "The attestation's head_sha (${attestation_head:-missing}) must exactly match the"
                echo "pull request head (${PR_HEAD_SHA}). An attestation produced for an earlier"
                echo "commit does not prove this head passed review, test, and document."
                echo
                echo "Re-run the pipeline with 'git push no-mistakes' at the current head."
                echo "See CONTRIBUTING.md for setup and the full workflow."
                echo
                echo "PR author: ${PR_AUTHOR}"
              } >&2
              exit 1
            fi
            echo "Attestation is bound to pull request head ${PR_HEAD_SHA}."
            malformed_steps=$(printf '%s' "$json" | jq -r '
              if (.steps | type) != "array" then
                "steps"
              elif any(.steps[]; (type != "object") or
                ((.step | type) != "string") or (.step == "") or
                ((.status | type) != "string")) then
                "steps"
              else
                empty
              end
            ' 2>/dev/null) || malformed_steps='invalid'
            if [ -n "$malformed_steps" ]; then
              echo "::error::The no-mistakes pipeline attestation contains a malformed steps member." >&2
              exit 1
            fi
            duplicate_steps=$(printf '%s' "$json" | jq -r '
              if (.steps | type) == "array" then
                ([.steps[] | select(type == "object") | .step] | group_by(.)[] | select(length > 1) | .[0])
              else
                empty
              end
            ' 2>/dev/null) || duplicate_steps='invalid'
            if [ -n "$duplicate_steps" ]; then
              echo "::error::The no-mistakes pipeline attestation contains duplicate step names: ${duplicate_steps}." >&2
              exit 1
            fi
            incomplete=''
            for required in review test document; do
              status=$(printf '%s' "$json" | jq -r --arg step "$required" \
                '([(.steps | arrays | .[]) | select(.step == $step) | .status] | first // empty | select(. != "")) // "missing"')
              if [ "$status" != "completed" ]; then
                if [ -n "$incomplete" ]; then
                  incomplete="${incomplete}, "
                fi
                incomplete="${incomplete}${required}=${status}"
              fi
            done
            if [ -n "$incomplete" ]; then
              {
                echo "::error::Required no-mistakes pipeline steps are not completed: ${incomplete}."
                echo
                echo "This repository requires review, test, and document to each have status"
                echo "exactly 'completed'. Quota skips and agent skips are not compliant."
                echo
                echo "Re-run the pipeline with 'git push no-mistakes' using no-mistakes >= 1.46.0"
                echo "so those required steps complete rather than skip."
                echo "See CONTRIBUTING.md for setup and the full workflow."
                echo
                echo "PR author: ${PR_AUTHOR}"
              } >&2
              exit 1
            fi
            echo "Pipeline step attestation is valid: review, test, and document are completed."
            exit 0
          fi
          {
            echo "::error::This PR was not raised through no-mistakes."
            echo
            echo "Contributions to this repository must be submitted via 'git push no-mistakes'."
            echo "That pipeline runs the required review/test/lint/CI steps and writes a"
            echo "deterministic '## Pipeline' section into the PR body containing:"
            echo
            echo "    $marker"
            echo
            echo "See CONTRIBUTING.md for setup and the full workflow."
            echo
            echo "PR author: ${PR_AUTHOR}"
          } >&2
          exit 1
