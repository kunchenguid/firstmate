name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Verify no-mistakes signature in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          # The payload body is a point-in-time snapshot, and no-mistakes pushes
          # commits (synchronize) BEFORE it writes the '## Pipeline' section
          # (edited). A head-change run that starts late therefore replays a
          # pre-signature body after the body was already signed, and because
          # body events and head changes sit in different concurrency groups
          # that stale verdict is never superseded - leaving a compliant PR red.
          # Re-read the live body for a bounded window before failing; fall
          # back to the snapshot only when the live body is unreadable, so an
          # unreachable API can never pass an unsigned PR.
          body=${PR_BODY:-}
          origin='event payload'
          repo=${GH_REPO:-${GITHUB_REPOSITORY:-}}
          if [ -n "${GH_TOKEN:-}" ] && [ -n "$repo" ] && command -v gh >/dev/null 2>&1; then
            live_attempts=6
            live_delay_seconds=15
            attempt=1
            while [ "$attempt" -le "$live_attempts" ]; do
              if ! live_body=$(gh api "repos/${repo}/pulls/${PR_NUMBER}" --jq '.body // ""' 2>/dev/null); then
                echo "::warning::could not read the live body for PR #${PR_NUMBER}; judging the event payload snapshot instead."
                break
              fi
              body=$live_body
              origin='live PR body'
              if printf '%s' "$live_body" | grep -qF -- "$marker"; then
                echo "Found no-mistakes signature in PR #${PR_NUMBER} live body (attempt ${attempt})."
                exit 0
              fi
              if [ "$attempt" -lt "$live_attempts" ]; then
                sleep "$live_delay_seconds"
              fi
              attempt=$((attempt + 1))
            done
          fi
          if printf '%s' "$body" | grep -qF -- "$marker"; then
            echo "Found no-mistakes signature in PR #${PR_NUMBER} (${origin})."
            exit 0
          fi
          {
            echo "::error::This PR was not raised through no-mistakes."
            echo
            echo "Contributions to this repository must be submitted via 'git push no-mistakes'."
            echo "That pipeline runs the required review/test/lint/CI steps and writes a"
            echo "deterministic '## Pipeline' section into the PR body containing:"
            echo
            echo "    $marker"
            echo
            echo "See CONTRIBUTING.md for setup and the full workflow."
            echo
            echo "PR author: ${PR_AUTHOR}"
          } >&2
          exit 1
